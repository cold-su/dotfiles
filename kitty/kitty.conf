# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

#: Fonts {{{

#: kitty 拥有非常强大的 font 管理能力。你可以配置
#: 单独的 font face，甚至可以为特定字符指定专用 font。

# font_family      monospace
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

#: 你可以为 bold/italic/bold-italic 变体指定不同的 font。选择 font 最简单的方法是运行 `kitten
#: choose-fonts` 命令，它会提供一个漂亮的 UI，带预览，支持
#: 选择 variable font 和 font feature。如果你想学习手动选择
#: font，请阅读 font specification syntax
#: <https://sw.kovidgoyal.net/kitty/kittens/choose-fonts/#font-spec-
#: syntax>。

# font_size 11.0

#: Font size（以 pts 为单位）。

# force_ltr no

#: kitty 不支持 BIDI（双向文本），但对于 RTL
#: script，单词会自动以 RTL 顺序显示。也就是说，
#: 在 RTL script 中，"HELLO WORLD" 这些单词在 kitty 中显示为
#: "WORLD HELLO"，如果你尝试选中一个 RTL
#: 字符串的子串，你会得到字符串为 LTR 时该位置对应的字符。例如，假设希伯来语单词 ירושלים，
#: 选中屏幕上看起来是 ם 的那个字符，实际上
#: 写入 selection buffer 的字符是 י。kitty 的默认
#: 行为配合一个反转单词顺序的 filter 是有用的，
#: 但如果你想处理 RTL glyph，这就会
#: 非常棘手，所以提供此选项来关闭
#: 该行为。此外，此选项可以与命令行
#: 程序 GNU FriBidi <https://github.com/fribidi/fribidi#executable>
#: 配合使用以获得 BIDI 支持，因为它会强制 kitty 始终将
#: 文本视为 LTR，这正是 FriBidi 对 terminal 的期望。

# symbol_map

#: 例如：symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols

#: 将指定的 Unicode code point 映射到特定 font。当你需要
#: 对某些符号（如 Powerline）做特殊渲染时很有用，
#: 避免使用打过补丁的 font。每个 Unicode code
#: point 以 `U+<十六进制 code point>` 的形式指定。你可以
#: 指定多个 code point，用逗号分隔，范围
#: 用连字符分隔。此选项可以多次指定。
#: 语法为::

#:     symbol_map codepoints Font Family Name

# narrow_symbols

#: 例如：narrow_symbols U+E0A0-U+E0A3,U+E0C0-U+E0C7 1

#: 通常，对于 Private Use Unicode 字符以及某些 symbol/dingbat
#: 字符，如果该字符后面跟有一个或多个空格，
#: 且 font 中该字符具有较宽的宽高比，kitty 会使用这些额外 cell 将字符渲染得更大。使用此
#: 选项可以强制 kitty 将指定的 code point 限制在
#: 指定数量的 cell 内渲染（默认为一个 cell）。
#: 此选项可以多次指定。语法为::

#:     narrow_symbols codepoints [optionally the number of cells]

# disable_ligatures never

#: 选择如何处理多字符 ligature。默认
#: 始终渲染它们。你可以告诉 kitty 当 cursor 位于其上时
#: 不渲染它们（使用 cursor，以便编辑
#: 更容易），或者如果你不喜欢 ligature，可以让 kitty 完全不渲染（使用 always）。
#: ligature 策略可以按 window 设置，
#: 既可以使用 kitty remote control 功能，也可以在 kitty.conf 中为它定义
#: 快捷键，例如::

#:     map alt+1 disable_ligatures_in active always
#:     map alt+2 disable_ligatures_in all never
#:     map alt+3 disable_ligatures_in tab cursor

#: 注意这指的是 programming ligature，通常
#: 通过 calt OpenType feature 实现。要禁用一般
#: ligature，请使用 font_features 选项。

# font_features

#: 例如：font_features none

#: 精确选择启用或禁用哪些 OpenType feature。注意
#: 对于主 font，可以在使用 choose-fonts kitten 选择
#: font 时指定 feature。此设置对
#: fallback font 很有用。

#: 有些 font 可能包含对 terminal 有价值的 feature。例如，
#: Fira Code 包含一个 discretionary feature zero，它
#: 改变该 font 中 zero（0）的外观，使其更容易与 Ø 区分。Fira Code 还包含其他
#: 名为 Stylistic Sets 的 discretionary feature，其 tag
#: 为 ss01 到 ss20。

#: 关于单个 feature 的确切语法，请参阅
#: HarfBuzz 文档 <https://harfbuzz.github.io/harfbuzz-hb-
#: common.html#hb-feature-from-string>。

#: 注意此配置按 PostScript name 索引，而不是 font
#: family。这允许你定义非常精确的 feature 设置；
#: 例如，你可以在 italic font 中禁用某个 feature，但不在
#: regular font 中禁用。

#: 在 Linux 上，font feature 首先从 FontConfig 数据库读取，
#: 然后应用此选项，因此可以在
#: 一个集中位置进行配置。

#: 要获取 font 的 PostScript name，在 Linux 上使用 `fc-scan file.ttf`
#: 命令，或在 macOS 上使用 `Font Book 工具
#: <https://apple.stackexchange.com/questions/79875/how-can-i-get-the-
#: postscript-name-of-a-ttf-font-installed-in-os-x>`__。

#: 启用 alternate zero 和 oldstyle numerals::

#:     font_features FiraCode-Retina +zero +onum

#: 仅在 bold font 中启用 alternate zero::

#:     font_features FiraCode-Bold +zero

#: 禁用普通 ligature，但保留 calt feature（它
#: 在此 font 中打破单调感）::

#:     font_features TT2020StyleB-Regular -liga +calt

#: 与 force_ltr 配合使用时，你可能希望完全禁用阿拉伯语
#: shaping，只在其出现在文档中时查看孤立形式。
#: 你可以这样操作::

#:     font_features UnifontMedium +isol -medi -fina -init

# modify_font

#: 修改 font 特性，例如 underline 和 strikethrough 的
#: 位置或粗细。修改值可以带
#: px 后缀表示像素，或 % 后缀表示原始值的百分比。没有
#: 后缀表示使用 pts。例如::

#:     modify_font underline_position -2
#:     modify_font underline_thickness 150%
#:     modify_font strikethrough_thickness 200%
#:     modify_font strikethrough_position 2px

#: 此外，你可以修改每个 font glyph 渲染所在 cell 的大小，
#: 以及 glyph 在 cell 中放置的 baseline。例如::

#:     modify_font cell_width 80%
#:     modify_font cell_height -2px
#:     modify_font baseline 3

#: 注意修改 baseline 会自动以相同量调整
#: underline 和 strikethrough 的位置。
#: 增大 baseline 会提高 cell 内的 glyph，减小
#: 则会降低它们。减小 cell 大小可能会导致
#: 渲染伪影，请谨慎使用。

# box_drawing_scale 0.001, 1, 1.5, 2

#: 用于 box drawing Unicode 字符的线条尺寸。
#: 这些值以 pts 为单位。它们会按 monitor DPI 缩放
#: 得到像素值。必须有四个值，分别对应
#: thin、normal、thick 和 very thick 线条。

# undercurl_style thin-sparse

#: undercurl 的渲染样式。此选项采用
#: (thin|thick)-(sparse|dense) 的形式。Thin 和 thick 控制
#: undercurl 的粗细。Sparse 和 dense 控制
#: curl 振荡的频率。sparse 时 curl 每个字符
#: 出现一次峰值，dense 时两次。通过重新加载
#: config 或 remote control 动态更改此选项是未定义行为。

# underline_exclusion 1

#: 默认情况下，当 underline 与 descender 重叠时（即字母低于 baseline 的部分，如 y、
#: q、p 等），kitty 会在 underline 中渲染缺口。此选项控制缺口的粗细。它可以
#: 是一个无单位数字，表示 font 中指定 underline
#: 粗细的分数；也可以带
#: px（像素）或 pt（磅）后缀。设为零可禁用
#: 缺口。通过重新加载 config
#: 或 remote control 动态更改此选项是未定义行为。

# text_composition_strategy platform

#: 控制 kitty 如何将文本 glyph 合成到 background color 上。
#: 默认值 platform 会尽可能让文本渲染
#: 接近 kitty 运行平台的"原生"效果。

#: 值 legacy 使用旧的（kitty 0.28 之前）glyph
#: 合成策略。这会使浅色背景上的深色文本
#: 看起来更粗，深色背景上的浅色文本
#: 更细。也可能使某些文本的笔画看起来
#: 不均匀。

#: 你可以通过为此设置指定最多两个以空格分隔的数字，
#: 来微调 glyph 合成实际使用的 contrast curve。

#: 第一个数字是 gamma 调整，控制
#: 浅色背景上深色文本的粗细。增大该值
#: 会使文本看起来更粗。此值在 Linux 上默认为 1.0，
#: 在 macOS 上为 1.7。有效值为 0.01 及以上。
#: 结果会根据 background
#: 与 foreground 之间的亮度差进行缩放。浅色背景上的深色文本受到
#: curve 的完全影响，而深色背景上的浅色文本
#: 几乎不受影响。

#: 第二个数字是额外的乘法 contrast。它是
#: 0 到 100 的百分比。默认值在 Linux 上为 0，
#: 在 macOS 上为 30。

#: 如果你希望在浅色和深色主题中获得相近的粗细观感，
#: 一个不错的实验方法是先将值设为
#: 1.0 0 并使用深色主题。然后调整第二个参数直到
#: 看起来合适。接着切换到浅色主题，调整第一个
#: 参数直到感知到的粗细与深色主题一致。

# text_fg_override_threshold 0

#: 用于防止 foreground 与 background
#: color 之间对比度不足的设置。当使用的应用程序
#: 采用与你的配色方案对比不佳的颜色时很有用。默认
#: 值为 0，表示不进行任何 color override。有两种工作模式：

#: 带 ratio 后缀的值表示
#: foreground 与 background color 之间可接受的最小对比度比率。
#: 可能的值范围从 0.0 ratio 到 21.0 ratio。例如，要满足
#: WCAG level AA
#: <https://en.wikipedia.org/wiki/Web_Content_Accessibility_Guidelines>
#: 可以提供 4.5 ratio 的值。该算法使用
#: HSLuv <https://www.hsluv.org/> 实现，能够只改变
#: color 的感知亮度到所需程度，
#: 而不真正改变其 hue 和 saturation。

#: 带 % 后缀的值表示
#: foreground 与 background color 之间可接受的最小亮度差，
#: 低于该值 kitty 将 override foreground color。它是
#: 0 % 到 100 % 的百分比。如果
#: foreground 与 background 的亮度差低于此阈值，
#: 则 background 为深色时 foreground color 将设为 white，
#: background 为浅色时设为 black。

#: WARNING：某些程序使用字符（如 block character）
#: 进行图形显示，可能期望能够将
#: foreground 和 background 设置为相同（或相近）的颜色。如果
#: 你看到意外的条纹、点、线、错误的颜色、在期望有颜色
#: 的地方没有颜色，或任何图形显示问题，请尝试
#: 将 text_fg_override_threshold 设为 0 以判断这是否是
#: 问题根源，或考虑使用上述 ratio 模式
#: 而不是 % 模式。

#: }}}

#: Text cursor customization {{{

# cursor #cccccc

#: 默认文本 cursor color。如果设为特殊值 none，
#: cursor 将以"reverse video"效果渲染。其颜色
#: 将是其所在 cell 中文本的颜色，而文本
#: 将用 cell 的 background color 渲染。注意
#: 如果 terminal 中运行的程序设置了 cursor color，
#: 则以此为准。另外，如果 cell
#: background 和 foreground color 对比度很低，cursor color 也会被修改。注意
#: 某些 theme 会设置此值，因此如果你想 override 它，请将
#: 你的值放在 theme 文件被 include 的行之后。

# cursor_text_color #111111

#: cursor 下文本的颜色。如果你想让它改用
#: 下方 cell 的 background color 渲染，请使用
#: 特殊关键字：`background`。注意如果 cursor 设为 none，
#: 则忽略此选项。注意某些 theme 会设置此值，
#: 因此如果你想 override 它，请将你的值放在
#: theme 文件被 include 的行之后。

cursor_shape block

#: cursor shape 可以是 block、beam、underline 之一。注意
#: 重新加载 config 时，只有 cursor shape
#: 尚未被 terminal 中运行的程序设置时才会更改。此设置
#: 设置默认 cursor shape，terminal 中运行的应用程序
#: 可以 override 它。特别是，kitty 中的 shell integration
#: <https://sw.kovidgoyal.net/kitty/shell-integration/> 会在 shell prompt 处将
#: cursor shape 设为 beam。你可以通过
#: 将 shell_integration 设为 no-cursor 来避免这一点。

# cursor_shape_unfocused hollow

#: 定义 OS window 未聚焦时文本 cursor 的形状。
#: 未聚焦 cursor shape 可以是 block、beam、underline、
#: hollow 和 unchanged（保持 cursor shape 不变）之一。

# cursor_beam_thickness 1.5

#: beam cursor 的粗细（以 pts 为单位）。

# cursor_underline_thickness 2.0

#: underline cursor 的粗细（以 pts 为单位）。

cursor_blink_interval 0

#: cursor 闪烁的间隔（以秒为单位）。设为零可
#: 禁用闪烁。负值表示使用 system default。注意
#: 最小间隔将被限制为 repaint_delay。你还可以
#: 通过指定 easing function 来为 cursor 闪烁制作动画。例如，
#: 将此选项设为 0.5 ease-in-out 会使
#: cursor 闪烁动画持续一秒，在前半秒
#: 从 opaque 变为 transparent，然后
#: 在后半秒再变回来。你可以为
#: 这两个半段指定不同的 easing function，例如：-1 linear ease-out。kitty 支持所有
#: CSS easing function <https://developer.mozilla.org/en-
#: US/docs/Web/CSS/easing-function>。注意开启动画
#: 会消耗额外电量，因为屏幕会在
#: 每个闪烁间隔内重绘多次。另见 cursor_stop_blinking_after。此
#: 设置也控制闪烁文本，其与
#: cursor 以完全相同的节奏闪烁。

# cursor_stop_blinking_after 15.0

#: 键盘无操作达到指定秒数后停止
#: 闪烁 cursor。设为零表示永不停止闪烁。此
#: 设置也控制闪烁文本，其与
#: cursor 以完全相同的节奏闪烁。

cursor_trail 1

#: 将此值设为大于零的数字以启用"cursor trail"
#: 动画。这是一种显示跟随文本 cursor 移动的"trail"的动画。它使
#: 大范围 cursor 跳转易于跟踪，并产生 cursor
#: 在屏幕上飞驰的酷炫视觉效果。此选项的实际值控制
#: 动画何时触发。它是一个毫秒数。
#: trail 动画只跟随在
#: 指定毫秒数内保持不动的 cursor。这可以防止
#: 复杂应用程序中 UI 更新期间快速改变
#: 位置的 cursor 出现 trail。参见
#: cursor_trail_decay 控制动画速度，
#: cursor_trail_start_threshold 控制 cursor trail
#: 何时开始。

cursor_trail_decay 0.1 0.4

#: 启用 cursor_trail 时控制 cursor trail 效果的衰减时间。
#: 此选项接受两个正 float 值，指定最快和最慢的衰减时间（以秒为单位）。
#: 第一个值对应最快的衰减时间（最小值），
#: 第二个值对应最慢的衰减时间
#: （最大值）。第二个值必须大于或等于
#: 第一个值。较小的值会使 cursor trail
#: 衰减得更快。调整这些值可以控制 cursor trail
#: 消失的速度。

cursor_trail_start_threshold 2

#: 设置启动 cursor trail 的距离阈值。此
#: 选项接受一个或两个正 integer 值。指定单个
#: 值时，它同时设置水平（x）
#: 和垂直（y）移动的阈值。指定两个值时，第一个
#: 设置 x（水平）阈值，第二个设置 y
#: （垂直）阈值。这些值表示 cursor 在
#: trail 启动前必须在每个维度上移动的最少
#: cell 数。当 cursor 在两个
#: 维度上的移动都低于阈值时，跳过 trail，从而减少不必要的 cursor trail
#: 动画。
# cursor_trail_color none

#: 启用 cursor_trail 时设置 cursor trail 的颜色。如果
#: 设为 'none'（默认值），cursor trail 将使用 cursor 的
#: background color。否则，指定一个 color value（例如 #ff0000
#: 表示红色，或 'red' 这样的命名颜色）。这允许你独立于 cursor
#: color 自定义 cursor trail 的外观。

#: }}}

#: Scrollback {{{

# scrollback_lines 2000

#: 保留在 memory 中用于回滚浏览的 history 行数。
#: Memory 按需分配。负数（实际上）表示
#: 无限 scrollback。注意不建议使用非常大的 scrollback，
#: 因为它会降低 terminal 的性能并
#: 占用大量 RAM。相反，请考虑使用
#: scrollback_pager_history_size。注意重新加载 config 时
#: 如果更改此值，只会影响新建的 window，不影响现有
#: window。

# scrollbar scrolled

#: 控制 scrollbar 何时显示。

#: scrolled
#:     表示当开始向后滚动时。
#: hovered
#:     表示当 mouse 悬停在 window 右边缘时。
#: scrolled-and-hovered
#:     表示当 mouse 位于 scrollbar 区域上*且*已开始向后滚动时。
#: always
#:     表示只要存在任何 scrollback 时。
#: never
#:     表示禁用 scrollbar。

# scrollbar_interactive yes

#: 如果禁用，scrollbar 将无法通过 mouse
#: 控制，所有 mouse 事件都会穿透 scrollbar。

# scrollbar_jump_on_click yes

#: 启用时，点击 scrollbar 轨道会使滚动
#: 位置跳转到点击位置，否则滚动
#: 位置只会朝该位置移动一个屏幕，
#: 这是传统 scrollbar 的行为方式。

# scrollbar_width 0.5

#: scrollbar 的宽度，以 cell 宽度为单位。

# scrollbar_hover_width 1

#: mouse 悬停其上时 scrollbar 的宽度，以
#: cell 宽度为单位。

# scrollbar_handle_opacity 0.5

#: scrollbar 手柄的透明度，0 为完全透明，
#: 1 为完全不透明。

# scrollbar_radius 0.3

#: scrollbar 手柄的半径（曲率），以 cell
#: 宽度为单位。应小于 scrollbar_width。

# scrollbar_gap 0.1

#: scrollbar 与 window 边缘之间的间隙，以 cell
#: 宽度为单位。

# scrollbar_min_handle_height 1

#: scrollbar 手柄的最小高度，以 cell 高度为单位。
#: 防止 scrollback 很多时手柄
#: 变得太小。

# scrollbar_hitbox_expansion 0.25

#: 手柄周围便于抓取 scrollbar 的额外区域，
#: 以 cell 宽度为单位。

# scrollbar_track_opacity 0

#: scrollbar 轨道的透明度，0 为完全透明，1
#: 为完全不透明。

# scrollbar_track_hover_opacity 0.1

#: mouse 位于 scrollbar 上时轨道的透明度，0 为完全透明，1
#: 为完全不透明。

# scrollbar_handle_color foreground

#: scrollbar 手柄的颜色。值 foreground 表示
#: 使用当前 foreground 文本颜色，值
#: selection_background 表示使用当前 selection background
#: color。此外，你可以使用任意颜色，例如 #12af59 或
#: red。

# scrollbar_track_color foreground

#: scrollbar 轨道的颜色。值 foreground 表示
#: 使用当前 foreground 文本颜色，值
#: selection_background 表示使用当前 selection background
#: color。此外，你可以使用任意颜色，例如 #12af59 或
#: red。

# progress_bar top

#: 当程序使用 OSC 9;4 escape sequence 报告进度时，
#: 在 window 的指定位置绘制一个进度条。该
#: 进度条使用与 scrollbar 相同的样式和颜色设置。

#: left
#:     左侧边缘的垂直进度条
#: right
#:     右侧边缘的垂直进度条
#: top
#:     顶部边缘的水平进度条
#: bottom
#:     底部边缘的水平进度条
#: hidden
#:     不显示进度条

# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

#: 在新 window 中查看 scrollback 所用的程序。scrollback buffer 作为 STDIN
#: 传递给该程序。如果你更改
#: 它，请确保你使用的程序能处理用于
#: 颜色和文本格式的 ANSI escape sequence。上面命令行中的 INPUT_LINE_NUMBER
#: 将被替换为一个整数，表示哪一行
#: 应位于屏幕顶部。类似地，CURSOR_LINE 和
#: CURSOR_COLUMN 将被替换为当前 cursor 位置，如果
#: 没有 cursor 则设为 0，例如在显示最后
#: 一条命令的输出时。

#: 如果你更愿意使用 neovim 查看 scrollback，可以
#: 这样配置::

#:     scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

#: 上述配置适用于 neovim 0.12 及更新版本。还有一个
#: 专用插件 kitty-scrollback.nvim
#: <https://github.com/mikesmithgh/kitty-scrollback.nvim> 可以使用，
#: 功能更多，也兼容更旧的 neovim。

# scrollback_pager_history_size 0

#: 单独的 scrollback history 大小（以 MB 为单位），仅用于
#: 通过 pager 浏览 scrollback buffer。这个单独的 buffer
#: 不用于交互式滚动，但在单独 window 中查看
#: scrollback buffer 时会通过管道传给 pager
#: 程序。当前实现以 UTF-8 存储数据，因此纯 ASCII
#: 无格式文本大约每 MB 10000 行（每行 100 字符）。
#: 值为零或更小会禁用此功能。
#: 允许的最大大小为 4GB。注意重新加载 config 时
#: 如果更改此值，只会影响新建的 window，不影响现有
#: window。

# scrollback_fill_enlarged_window no

#: 放大 window 后，用 scrollback buffer 中的行
#: 填充新增的空间。

# wheel_scroll_multiplier 5.0

#: mouse 滚轮滚动行数的乘数。
#: 注意这仅用于低精度滚动设备，
#: 不用于 macOS
#: 和 Wayland 等平台上的高精度滚动设备。使用负数可更改滚动方向。另见
#: wheel_scroll_min_lines。

# wheel_scroll_min_lines 1

#: mouse 滚轮滚动的最小行数。滚动
#: 乘数 wheel_scroll_multiplier 只有达到
#: 此数量后才生效。注意这仅用于
#: 低精度滚动设备，如每次滚轮滚动量
#: 很小的滚轮鼠标。使用负数时，最小行数
#: 将始终被加上。

# touch_scroll_multiplier 1.0

#: touchpad 滚动行数的乘数。注意
#: 这仅用于 macOS
#: 和 Wayland 等平台上的高精度滚动设备。使用负数可更改
#: 滚动方向。

# pixel_scroll yes

#: 使用高精度输入设备（例如 touchpad）时，
#: 在 kitty scrollback buffer 中启用逐像素滚动。启用时，
#: kitty 自己的 scrollback 将按子行增量移动，
#: 而不只是整行。这不影响
#: terminal 内部运行的处理
#: 自身滚动的应用程序（例如全屏 TUI）。

# momentum_scroll 0.96

#: 用于减慢 momentum（惯性）
#: 滚动所施加的摩擦量。范围为 0 到 1，
#: 0 表示无 momentum 滚动，1 表示无限滚动。注意此设置
#: 仅适用于 Wayland 等
#: 不提供原生 momentum 滚动的平台。在 macOS 上，使用基于原生 OS 的
#: momentum 滚动。此外，momentum 滚动仅适用于
#: touchpad 和 touchscreen 等"手指"类设备。更改
#: 此设置仅在 kitty 重启后生效。

#: }}}

#: Mouse {{{

# mouse_hide_wait 3.0

#: mouse 未使用达到指定秒数后隐藏
#: mouse cursor。设为零可禁用 mouse cursor 隐藏。
#: 设为负值可在输入文本时立即隐藏 mouse cursor。
#: 在 macOS 上默认禁用，因为要让它
#: 在 Cocoa 那不断变化的 bug 海洋中可靠工作
#: 太费劲了。

#: 默认情况下，cursor 一旦隐藏，在
#: 任何后续 mouse 事件上会立即重新显示。

#: 支持两种格式：
#:  - <hide-wait>
#:  - <hide-wait> <unhide-wait> <unhide-threshold> <scroll-unhide>

#: 要更改 unhide 行为，可以设置可选参数 <unhide-
#: wait>、<unhide-threshold> 和 <scroll-unhide>。

#: <unhide-wait>
#:     mouse 事件后等待指定的秒数再取消隐藏
#:     mouse cursor。设为零可在 mouse 活动时立即取消隐藏 mouse cursor。
#:     这有助于防止意外滑动
#:     trackpad 时取消隐藏 mouse cursor。

#: <unhide-threshold>
#:     当 <unhide-wait> 选项非零时，设置取消隐藏 mouse cursor 所需的 mouse 活动阈值。当 <unhide-wait> 为零时，
#:     此参数无
#:     效果。

#:     例如，如果 <unhide-threshold> 为 40 且 <unhide-wait> 为 2.5，当 kitty
#:     检测到 mouse 事件时，它会记录接下来 2.5
#:     秒内的 mouse 事件数量，并检查是否超过 40 * 2.5 = 100。如果超过，则
#:     mouse cursor 被取消隐藏，否则什么也不发生。

#: <scroll-unhide>
#:     控制哪些 mouse 事件可以取消隐藏 mouse cursor。如果启用，滚动
#:     和移动事件都可以取消隐藏 cursor。如果禁用，只有 mouse 移动才能
#:     取消隐藏 cursor。

#: 有效值示例：
#:  - 0.0
#:  - 1.0
#:  - -1.0
#:  - 0.1 3.0 40 yes

# url_color #0087bd
# url_style curly

#: mouse-over 时高亮 URL 的颜色和样式。url_style
#: 可以是：none、straight、double、curly、dotted、dashed 之一。

# open_url_with default

#: 打开被点击 URL 的程序。特殊值 default 会
#: 首先查找通过 open_actions
#: <https://sw.kovidgoyal.net/kitty/open_actions/> 机制定义的任何 URL handler，如果
#: 没有找到，则使用操作系统的默认 URL handler
#: （macOS 上是 open，Linux 上是 xdg-open）。

# url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

#: 检测 mouse cursor 下 URL 时要查找的 URL prefix 集合。

# detect_urls yes

#: 检测 mouse 下的 URL。检测到的 URL 会以
#: underline 高亮，mouse cursor 悬停其上时会变成手形。即使
#: 禁用此选项，URL 仍然可点击。另见
#: underline_hyperlinks 选项，控制 hyperlink（相对于
#: 纯文本 URL）的显示方式。

# url_excluded_characters

#: 检测 mouse cursor 下的 URL 时，
#: 不允许出现在 URL 中的额外字符。默认情况下，
#: URL 中合法的所有字符都允许。此外，允许换行（但会
#: 被剥离）。这是为了容纳 mutt 之类的程序，
#: 它们即使对续行也会添加硬换行。可以将 \n 添加到
#: 此选项以禁用此行为。特殊字符可以使用
#: 反斜杠转义指定，要指定反斜杠请使用
#: 双反斜杠。

# show_hyperlink_targets never

#: 当 mouse 悬停在 terminal hyperlink 上时，显示
#: 点击该 hyperlink 将激活的实际 URL。设为
#: ctrl、cmd、alt 或 shift，仅在按下相应
#: modifier 键时显示（Ctrl、Super（macOS Cmd）、Shift）。如果
#: 按下了多个 modifier，只要配置的 modifier
#: 在其中就显示 URL。always 表示始终显示，never
#: 表示从不显示。

# underline_hyperlinks hover

#: 控制 hyperlink 的下划线方式。它们可以在
#: mouse 悬停时加下划线、始终加下划线（即永久下划线）或
#: 从不加下划线（never 表示 kitty 不对
#: hyperlink 应用任何下划线样式）。注意值 always 只适用于真正的
#: （OSC 8）hyperlink，不适用于 mouse 悬停时检测为 URL 的文本。
#: 下划线样式使用 url_style 和 url_color 设置。注意重新加载 config 并将此值
#: 改为/改为 always 只会影响 kitty 之后
#: 收到的文本。

# copy_on_select no

#: 选择时复制到 clipboard 或私有 buffer。设为
#: clipboard 后，用 mouse 选择文本会将文本
#: 复制到 clipboard。在 macOS 等
#: 没有 primary selection 概念的平台上很有用。你也可以指定
#: 像 a1 这样的名称，复制到私有 kitty buffer。将快捷键
#: 映射到 paste_from_buffer action 可从该私有
#: buffer 粘贴。例如::

#:     copy_on_select a1
#:     map shift+cmd+v paste_from_buffer a1

#: 注意复制到 clipboard 存在安全风险，因为所有
#: 程序（包括浏览器中打开的网站）都可以读取
#: system clipboard 的内容。

# clear_selection_on_clipboard_loss no

#: 当 clipboard 的内容不再反映当前
#: selection 时，清除它。这在 Linux
#: 等平台上主要用于：选择文本会自动将其复制到
#: 特殊的"primary selection"clipboard，或者你已将 copy_on_select 设为
#: clipboard。

#: 注意在 macOS 上，系统在 clipboard
#: 所有者更改时不会提供通知，因此在
#: 非 kitty 应用程序中复制到 clipboard 不会清除 selection，即使
#: 启用了 copy_on_select。

# paste_actions quote-urls-at-prompt,confirm

#: 粘贴或拖放文本到 terminal 时采取的操作的逗号分隔列表。支持的 paste action 有：

#: quote-urls-at-prompt:
#:     如果粘贴的文本是 URL 且 cursor 位于 shell prompt 处，
#:     自动对 URL 加引号（需要 shell_integration）。
#: replace-dangerous-control-codes
#:     不确认地替换粘贴文本中的危险 control code。
#: replace-newline
#:     不确认地替换粘贴文本中的换行字符。
#: confirm:
#:     如果要粘贴的文本包含任何 terminal control code，确认
#:     粘贴，因为这可能很危险，如果 terminal
#:     中运行的 shell/程序不能正确处理这些 code，
#:     可能导致代码执行。
#: confirm-if-large
#:     如果粘贴内容非常大（大于 16KB），确认
#:     粘贴，因为向 shell 粘贴大量
#:     文本可能非常慢。
#: filter:
#:     对粘贴的文本运行 kitty config 目录中
#:     paste-actions.py 文件里的 filter_paste() 函数。该函数返回的
#:     文本才是实际粘贴的文本。
#: no-op:
#:     无任何效果。

# strip_trailing_spaces never

#: 复制到 clipboard 时删除行尾的空格。值
#: smart 会在使用普通 selection 时执行，但
#: 矩形 selection 时不执行。值 always 始终执行。

# select_by_word_characters @-./_~?&=%+#

#: 双击时视为单词一部分的字符。除了
#: 这些字符，任何在 Unicode 数据库中
#: 标记为字母数字的字符都会被匹配。

# select_by_word_characters_forward

#: 双击向前扩展 selection 时视为单词一部分的字符。除了
#: 这些字符，任何在 Unicode 数据库中
#: 标记为字母数字的字符都会被匹配。

#: 如果为空（默认），select_by_word_characters 将用于
#: 两个方向。

# click_interval -1.0

#: 检测双击/三击的连续点击间隔
#: （以秒为单位）。负数将改用系统默认值，
#: 如果可用，否则回退到 0.5。

# focus_follows_mouse no

#: mouse 移入不同 window 时，将活动 window 设置为
#: mouse 下的 window。mouse 在单个 window
#: 内移动时活动 window 不变，因此
#: 意外的 mouse 碰触不会撤销键盘驱动的
#: window 切换。设为 drop 表示仅在 window 中发生
#: 拖放时才更改 focus。在 macOS 上，只要 kitty
#: 应用程序是活动
#: 应用程序，mouse 进入其下的 OS window 时也会自动聚焦该
#: OS window。

# pointer_shape_when_grabbed arrow

#: terminal 中运行的程序抓取 mouse 时
#: mouse pointer 的形状。

# default_pointer_shape beam

#: mouse pointer 的默认形状。

# pointer_shape_when_dragging beam crosshair

#: 拖动文本时 mouse pointer 的默认形状。
#: 可选的第二个值设置在
#: 矩形 selection 模式下拖动时的形状。

# drag_threshold 5

#: mouse 启动拖放必须移动的阈值距离。
#: 拖动适用于 tab 和 window。你可以拖动 tab 重新排
#: 序、将它们分离到新的 OS window 或移动到另一个
#: OS window。类似地，拖动 window 的 titlebar（参见
#: toggle_window_title_bars）可以在其 layout 中重新排序、分离
#: 它或移动到另一个 tab。值为零禁用所有
#: 拖动。

#: 注意在 Wayland 上，由于设计不佳
#: <https://gitlab.freedesktop.org/wayland/wayland/-/issues/140>
#: 取消拖动会分离 tab。对于支持 xdg-toplevel-drag
#: <https://wayland.app/protocols/xdg-toplevel-drag-v1> 的
#: compositor 已做变通处理。

#: Mouse actions {{{

#: Mouse button 可以映射为执行任意 action。语法是：

#: .. code-block:: none

#:     mouse_map button-name event-type modes action

#: 其中 button-name 是 left、middle、right、b1 ... b8 之一，
#: 可附加键盘 modifier。例如：ctrl+shift+left 表示
#: 按住 Ctrl+Shift 键的同时点击左 mouse
#: button。值 b1 ... b8 可用于指代 mouse 上最多八个
#: button。

#: event-type 是 press、release、doublepress、triplepress、
#: click、doubleclick 之一。modes 指示该 action 是在
#: terminal 中运行的程序抓取 mouse 时
#: 执行，还是不抓取时执行。值为 grabbed 或 ungrabbed，
#: 或它们的逗号分隔组合。grabbed 指 terminal 中
#: 运行的程序已请求 mouse 事件。注意 click 和
#: double click 事件有 click_interval 的延迟，以与
#: double 和 triple press 区分。

#: 你可以使用 kitty --debug-input 命令行选项运行 kitty
#: 来查看 mouse 事件。参见下面的内置 action
#: 以了解可能的功能。

#: 如果你想取消映射某个 button，将其映射为 nothing 即可。例如，要
#: 禁用单击打开 URL::

#:     mouse_map left click ungrabbed

#: 在此查看所有可映射的 action（包括 mouse action）
#: <https://sw.kovidgoyal.net/kitty/actions/>。

#: .. note::
#:     一旦 selection 开始，松开启动它的按钮将
#:     自动结束它，并且不会派发 release 事件。

# clear_all_mouse_actions no

#: 移除到此为止的所有 mouse action 定义。例如，可用于
#: 移除默认 mouse action。

#: 点击 mouse 下的 link，或将 cursor 移动到点击位置

# mouse_map left click ungrabbed mouse_handle_click selection link prompt

#::  首先检查 selection，如果存在则不执行任何操作。然后
#::  检查 mouse cursor 下是否有 link，如果有则点击
#::  它。最后检查点击是否发生在当前 shell
#::  prompt 处，如果是则将 cursor 移动到点击位置。注意
#::  这需要 shell integration
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> 才能工作。

#: 即使被抓取，也点击 mouse 下的 link 或将 cursor 移动到点击位置

# mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt

#::  与上述相同，区别在于即使
#::  mouse 被 terminal 中运行的程序抓取也执行该 action。

#: 点击 mouse cursor 下的 link

# mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link

#::  提供 Ctrl+Shift 变体是因为基于简单单击的
#::  版本有不可避免的 click_interval 延迟，用于
#::  区分单击与双击。

#: 丢弃 link 点击的 press 事件

# mouse_map ctrl+shift+left press grabbed discard_event

#::  防止此 press 事件被发送到
#::  抓取 mouse 的程序，因为相应的 release 事件用于
#::  打开 URL。

#: 从 primary selection 粘贴

# mouse_map middle release ungrabbed paste_from_selection

#: 开始选择文本

# mouse_map left press ungrabbed mouse_selection normal

#::  如果你想拖放 hyperlink 或检测到的 URL，
#::  请改用 drag_or_normal_select 而不是 normal，如果
#::  mouse 下有 hyperlink，将根据 drag_threshold 拖动它，
#::  否则执行普通 selection。

#: 开始以矩形选择文本

# mouse_map ctrl+alt+left press ungrabbed mouse_selection rectangle

#: 选择一个单词

# mouse_map left doublepress ungrabbed mouse_selection word

#: 选择一行

# mouse_map left triplepress ungrabbed mouse_selection line

#: 从第一个 cell 选择行

# mouse_map alt+left triplepress ungrabbed mouse_selection line_from_begin

#: 从点击点选择行

# mouse_map ctrl+alt+left triplepress ungrabbed mouse_selection line_from_point

#::  从点击点选择到行尾。如果你
#::  想先选择点击处的单词，然后扩展到
#::  行的其余部分，请将 `line_from_point` 改为
#::  `word_and_line_from_point`。

#: 扩展当前 selection

# mouse_map right press ungrabbed mouse_selection extend

#::  如果你只想移动 selection 的末端而不是
#::  最近的边界，请使用 move-end 而不是 extend。

#: 使用 shift 扩展当前 selection

# mouse_map shift+left press ungrabbed mouse_selection extend

#::  如果你只想移动 selection 的末端而不是
#::  最近的边界，请使用 move-end 而不是 extend。

#: 即使被抓取也从 primary selection 粘贴

# mouse_map shift+middle release ungrabbed,grabbed paste_selection
# mouse_map shift+middle press grabbed discard_event

#: 即使被抓取也开始选择文本

# mouse_map shift+left press grabbed mouse_selection normal

#: 即使被抓取也开始以矩形选择文本

# mouse_map ctrl+shift+alt+left press ungrabbed,grabbed mouse_selection rectangle

#: 即使被抓取也选择一个单词

# mouse_map shift+left doublepress ungrabbed,grabbed mouse_selection word

#: 即使被抓取也选择一行

# mouse_map shift+left triplepress ungrabbed,grabbed mouse_selection line

#: 即使被抓取也从第一个 cell 选择行

# mouse_map shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_begin

#: 即使被抓取也从点击点选择行

# mouse_map ctrl+shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_point

#::  即使被抓取，也从点击点选择到行尾。如果你
#::  想先选择点击处的单词，然后扩展到
#::  行的其余部分，请将 `line_from_point` 改为
#::  `word_and_line_from_point`。

#: 即使被抓取也扩展当前 selection

# mouse_map shift+right press ungrabbed,grabbed mouse_selection extend

#: 在 pager 中显示点击的命令输出

# mouse_map ctrl+shift+right press ungrabbed mouse_show_command_output

#::  需要 shell integration
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> 才能工作。

#: }}}

#: }}}

#: Performance tuning {{{

# repaint_delay 10

#: 屏幕更新之间的延迟（以毫秒为单位）。减小它
#: 会提高每秒帧数（FPS），代价是更多 CPU 使用。
#: 默认值产生约 100 FPS，对大多数
#: 用途来说绰绰有余。注意要真正达到 100 FPS，你
#: 必须将 sync_to_monitor 设为 no，或使用高
#: 刷新率的 monitor。此外，为了在有待处理输入
#: 时最小化延迟，会忽略此选项。

# input_delay 3

#: 处理 terminal 中运行的程序输入的延迟
#: （以毫秒为单位）。注意减小它会提高
#: 响应速度，但也会增加 CPU 使用，并可能在
#: 每次循环重绘整个屏幕的全屏程序中导致闪烁，
#: 因为 kitty 太快，会绘制部分屏幕更新。
#: 当 input buffer 几乎满时忽略此设置。

# sync_to_monitor yes

#: 将屏幕更新与 monitor 的刷新率同步。这
#: 可防止滚动时屏幕撕裂
#: <https://en.wikipedia.org/wiki/Screen_tearing>。
#: 但是，它将渲染速度限制为 monitor 的刷新率。
#: 使用非常高速的 mouse/高键盘重复率时，
#: 你可能会注意到轻微的输入延迟。如果是这样，请将其设为 no。

#: }}}

#: Terminal bell {{{

enable_audio_bell no

#: 音频 bell。在需要
#: 安静的环境中禁用它很有用。

# visual_bell_duration 0.0

#: 视觉 bell 的持续时间（以秒为单位）。发生 bell 时
#: 屏幕闪烁指定的秒数。设为零可禁用。
#: 闪烁是动画，在指定的
#: 持续时间内淡入淡出。控制淡入淡出所用的 easing function
#: 可以控制。例如，2.0 linear 会使闪烁
#: 线性淡入淡出。未指定时的默认值是 ease-in-
#: out，它在开始、中间和结束处缓慢淡入淡出。你可以
#: 为淡入和淡出部分指定不同的 easing function，
#: 如下所示：2.0 ease-in linear。kitty 支持所有
#: CSS easing function <https://developer.mozilla.org/en-
#: US/docs/Web/CSS/easing-function>。

# visual_bell_color none

#: 视觉 bell 使用的颜色。设为 none 将回退到
#: selection background color。如果你觉得视觉 bell 太
#: 亮，可以将其设为较暗的颜色。

# window_alert_on_bell yes

#: bell 时请求 window 注意。使 dock 图标在
#: macOS 上弹跳，或 taskbar 在 Linux 上闪烁。

# bell_on_tab "🔔 "

#: 如果 tab 中某个未聚焦的 window 发生 bell，
#: 在 tab 上显示的一些文本或 Unicode 符号。如果你想使用前导
#: 或尾随空格，请用引号将文本括起来。参见
#: tab_title_template 了解其渲染方式。

#: 为了向后兼容，yes、y 和 true 这些值
#: 会转换为默认 bell 符号，no、n、false 和 none 会
#: 转换为空字符串。

# command_on_bell none

#: 发生 bell 时运行的程序。环境变量
#: KITTY_CHILD_CMDLINE 可用于获取发生 bell 的
#: window 中运行的程序。

# macos_dock_badge_on_bell yes

#: 发生 bell 且 kitty 不是
#: 活动应用程序时，在 kitty 的 dock 图标上显示徽章（仅限 macOS）。当
#: kitty 重新获得 focus 时徽章自动
#: 清除。

# bell_path none

#: 作为 bell 声音播放的音频文件路径。如果设为 none，则使用
#: 系统默认 bell 声音。必须是操作系统
#: sound API 支持的格式，例如 Linux 上的 WAV 或 OGA
#: （libcanberra），或 macOS 上的 AIFF、MP3 或 WAV（NSSound）。相对
#: 路径相对于 kitty config 目录解析。

# linux_bell_theme __custom

#: kitty 用来播放 bell 声音的 XDG Sound Theme。在
#: Wayland 上，当 compositor 支持时，会要求它播放
#: 系统默认 bell 声音，此设置无效。注意
#: Hyprland 声称支持此协议，但实际上不播放声音
#: <https://github.com/hyprwm/Hyprland/issues/10488>。此设置
#: 默认为 XDG Sound theme
#: 规范 <https://specifications.freedesktop.org/sound-theme-
#: spec/latest/sound_lookup.html> 中指定的自定义 theme 名称，如果
#: 不存在则回退到默认 freedesktop theme。要桌面范围地更改你的 sound theme，
#: 请创建
#: :file:~/.local/share/sounds/__custom/index.theme`，内容为：

#:     [Sound Theme]

#:     Inherits=name-of-the-sound-theme-you-want-to-use

#: 将 name-of-the-sound-theme-you-want-to-use 替换为实际的
#: theme 名称。现在所有合规的应用程序都应使用
#: 该 theme 中的声音。

#: }}}

#: Window layout {{{

remember_window_size  no
initial_window_width  1080
initial_window_height 720

#: 如果启用，将记住 OS window 大小，这样新的
#: kitty 实例将具有与上一个
#: 实例相同的大小。如果禁用，OS window 初始大小
#: 由 initial_window_width/height 配置，单位为像素。你可以在
#: 宽/高值上加 "c" 后缀，使其被解释为
#: cell 数而不是像素。

# remember_window_position no

#: 如果启用，将记住 OS window 位置，这样新的
#: kitty 实例将具有与上一个
#: 实例相同的位置。如果禁用，OS window 将由 window
#: manager 放置。注意位置记忆只有在
#: 底层桌面环境/window manager 支持时才有效。它在
#: Wayland 上从不工作。另见 kitty --position 以在
#: 启动 kitty 时指定位置。

# enabled_layouts *

#: 启用的 window layout。layout 名称的逗号分隔列表。
#: 特殊值 all 表示所有 layout。列出的第一个 layout
#: 将用作启动 layout。默认配置是所有
#: layout 按字母顺序排列。可用 layout 列表参见
#: layouts <https://sw.kovidgoyal.net/kitty/overview/#layouts>。

# window_resize_step_cells 2
# window_resize_step_lines 2

#: 使用 start_resizing_window 快捷键
#: 在 layout 中调整 kitty window 大小时的步长（以 cell 宽度/cell 高度为单位）。cells 值用于水平
#: 调整大小，lines 值用于垂直调整大小。

# window_border_width 0.5pt

#: window 边框的宽度。可以是像素（px）或 pts
#: （pt）。pt 值将根据屏幕分辨率舍入到
#: 最接近的像素数。如果未指定，单位默认为
#: pts。注意只有可见 window 多于一个时
#: 才显示边框。它们用于分隔多个 window。

# draw_minimal_borders yes

#: 只绘制所需的最小边框。这意味着只绘制
#: 将 window 与相邻 window 分隔开的边框。注意
#: 设置非零的 window_margin_width 会覆盖此设置，
#: 导致绘制所有边框。

# draw_window_borders_for_single_window no

#: 即使只有单个可见 window 时也围绕 window
#: 绘制边框。启用后，当只有单个 window 时，
#: 会围绕它绘制完整边框（如同 draw_minimal_borders
#: 为 false）。当 window 被聚焦且 OS window 有 focus 时，
#: 边框显示活动颜色；当 OS window 失去 focus 时，
#: 显示非活动颜色。这提供了
#: kitty window 是否聚焦的清晰视觉指示。当有多个
#: window 可见时，此选项无效，应用正常边框
#: 绘制规则。

# window_margin_width 0

#: window margin（以 pts 为单位）（边框外的空白区域）。单个
#: 值设置所有四个边。两个值设置垂直和
#: 水平边。三个值设置顶部、水平和底部。四个
#: 值设置顶部、右侧、底部和左侧。

# single_window_margin_width -1

#: 仅单个 window 可见时使用的 window margin（以
#: pts 为单位）。负值将改用 window_margin_width
#: 的值。单个值设置所有四个边。两个值
#: 设置垂直和水平边。三个值设置顶部、水平
#: 和底部。四个值设置顶部、右侧、底部和左侧。

# window_padding_width 0

#: window padding（以 pts 为单位）（文本与
#: window 边框之间的空白区域）。单个值设置所有四个边。两个值设置
#: 垂直和水平边。三个值设置顶部、水平
#: 和底部。四个值设置顶部、右侧、底部和左侧。

# single_window_padding_width -1

#: 仅单个 window 可见时使用的 window padding（以
#: pts 为单位）。负值将改用 window_padding_width
#: 的值。单个值设置所有四个边。两个值
#: 设置垂直和水平边。三个值设置顶部、水平
#: 和底部。四个值设置顶部、右侧、底部和左侧。

# placement_strategy center

#: 当 window 大小不是 cell 大小的精确倍数时，
#: terminal window 的 cell 区域会在
#: 两侧有一些额外的 padding。你可以通过
#: 此选项控制该 padding 的分布方式。使用
#: center 值表示 cell 区域将
#: 居中放置。top-left 值表示 padding 将
#: 只出现在底部和右侧边缘。值可以是：top-
#: left、top、top-right、left、center、right、bottom-left、bottom、
#: bottom-right 之一。

# active_border_color #00ff00

#: 活动 window 边框的颜色。将其设为 none 可
#: 不围绕活动 window 绘制边框。

# inactive_border_color #cccccc

#: 非活动 window 的边框颜色。

# bell_border_color #ff5a00

#: 发生 bell 的非活动 window 的边框颜色。

# inactive_text_alpha 1.0

#: 按指定量淡出非活动 window 中的文本。这
#: 必须是 -1 到 1 之间的数字。绝对值控制
#: 实际不透明度，零为完全淡出，一为完全
#: 不透明。使用正数时，即使
#: OS window 未聚焦且只有单个 window 可见，文本也会淡出。
#: 负数表示只有当 OS window 中可见的 kitty window
#: 多于一个时才淡出文本。淡出发生在除
#: 活动 window 之外的所有 window 中，即使 OS window 未聚焦
#: 也是如此。因此，如果你想依赖 window manager 来指示 OS
#: window focus，而此功能指示哪个 kitty window 在 OS window 内
#: 处于活动状态，这会很有用。

# hide_window_decorations no

#: 使用 yes 隐藏 window decorations（title-bar 和 window 边框）。
#: 在 macOS 上，可以使用 titlebar-only 和 titlebar-and-corners
#: 只隐藏 titlebar 和圆角。

#: 在 Wayland 上，可以使用 titlebar-only 隐藏 titlebar，同时
#: 保留用于调整大小的 window 阴影。在具有
#: server-side decorations 的 compositor 上（如除 GNOME 之外的任何
#: compositor），yes 和
#: titlebar-only 都会强制使用 client-side decoration 模式。

#: 是否有效以及确切效果取决于
#: window manager/操作系统。注意重新加载 config 时更改
#: 此选项的效果是未定义的。在 macOS 上使用
#: titlebar-only 时，同时设置
#: window_margin_width 和 placement_strategy 也很有用，可防止圆角
#: 裁剪文本。或者使用 titlebar-and-corners。

# window_logo_path none

#: logo 图像路径。必须是 PNG/JPEG/WEBP/GIF/TIFF/BMP 格式。
#: 相对路径相对于 kitty config
#: 目录解释。logo 显示在每个 kitty window 的一个角落。
#: 位置由 window_logo_position 控制。可以
#: 使用 launch action 或 remote control
#: <https://sw.kovidgoyal.net/kitty/remote-control/> 机制为单个
#: window 配置不同的 logo。

# window_logo_position bottom-right

#: logo 在 window 中的位置。值可以是：
#: top-left、top、top-right、left、center、right、bottom-left、
#: bottom、bottom-right 之一。

# window_logo_alpha 0.5

#: logo 淡入 background 的程度。零
#: 为完全淡出，一为完全不透明。

# window_logo_scale 0

#: logo 缩放到 window 大小的百分比（0-100]。
#: 使用单个数字表示 logo 缩放到
#: 最短 window 尺寸的该百分比，同时保持
#: logo 图像的宽高比。

#: 使用两个数字表示 logo 的宽度和高度分别缩放到
#: window 宽度和高度的相应百分比。

#: 使用零作为百分比会禁用该维度的缩放。单个
#: 零（默认值）禁用 window logo 的所有缩放。

# resize_debounce_time 0.1 0.5

#: OS window 实时调整大小期间，在未收到
#: 新的 resize 事件时（即调整大小
#: 暂停或结束时），等待请求 kitty 中运行的
#: 程序调整大小并重绘屏幕的时间（以秒为单位）。在 macOS
#: 等操作系统发送与实时调整大小开始和结束
#: 相对应事件的平台上，第二个数字用于
#: 暂停后重绘，因为 kitty 可以区分调整大小的暂停和结束。
#: 在此类系统上忽略第一个数字，调整大小结束后
#: 立即重绘。在其他系统上只使用第一个
#: 数字，这样调整大小结束后 kitty 能快速"就绪"，
#: 同时不会持续重绘以节省电量。

# resize_in_steps no

#: 以与 cell 一样大的步长调整 OS window 大小，而不是
#: 通常的像素精度。与以 cell 数指定的
#: initial_window_width
#: 和 initial_window_height 结合，此选项可用于
#: 在调整 OS
#: window 大小时尽量保持较小的 margin。注意这目前
#: 在 Wayland 上不起作用。

# visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ

#: 视觉 window 选择的字符列表。例如，
#: 用于 focus_visible_window 选择要聚焦的 window。
#: 值应是一系列唯一数字或字母，不区分大小写，
#: 来自集合 0-9A-Z\-=[];',./\\`。将你的
#: 偏好指定为字符串。

# confirm_os_window_close -1

#: 当通过 window manager（例如
#: 点击 window 关闭按钮或按操作系统
#: 关闭 window 的快捷键）或通过 close_tab action 关闭
#: 至少包含此数量 kitty window 的 OS window 或 tab 时，
#: 请求确认。值为
#: 零禁用确认。此确认也适用于
#: 退出整个应用程序的请求（所有 OS window，通过
#: quit action）。负值会转换为正值，
#: 但是，启用 shell_integration 时，使用负值
#: 表示位于 shell prompt 处的 window 不计数，只有
#: 当前正在运行某个命令的 window 才计数。你还可以
#: 通过向设置添加 count-background 让后台
#: 任务阻止关闭，例如：-1 count-background。注意如果你想
#: 在关闭单个 window 时请求确认，可以映射
#: close_window_with_confirmation action。

# window_drag_tolerance 2

#: 控制拖动 window 边框以调整 kitty window 大小。这是
#: window 边框周围按下左 mouse
#: button 将开始拖动 window
#: 边框的区域的容差（以 pts 为单位）。使用像 -200 这样的大负值
#: 禁用边框拖动。注意因为 kitty 使用 layout，拖动
#: 边框实际上不会调整 window 本身的大小，而是调整
#: layout 行/列/槽，这可能导致多个
#: window 被调整大小。

# window_title_bar top

#: 控制 window title bar 相对于 window
#: 内容的位置。使用 window_title_bar_min_windows 控制 title
#: bar 何时显示。使用 window_title_template 格式化显示的
#: window title。

# window_title_bar_min_windows 0

#: 显示 window title bar 之前 tab 中最少可见 window 数。值 0 表示从不显示。1 表示始终显示。
#: 2 或更多表示只有当至少这么多 window
#: 可见时才显示。类似于 tab bar 的 tab_bar_min_tabs。

# window_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}{title}"

#: 渲染 window title bar 文本的模板。使用与
#: tab_title_template 相同的模板语法。可用变量包括：
#: {title}、{bell_symbol}、{activity_symbol}、{progress_percent}、
#: {custom}、{fmt}、{is_active}。你还可以在 kitty config
#: 目录的 window_title_bar.py 中提供自定义
#: draw_window_title(data) 函数，通过 {custom} 暴露。

# active_window_title_template none

#: 用于活动 window title bar 的模板。如果未设置（值为
#: none），则使用 window_title_template。

# window_title_bar_active_foreground none

#: 活动 window title bar 的 foreground color。设为
#: none 时默认为相应的 tab bar 颜色（active_tab_foreground）。

# window_title_bar_active_background none

#: 活动 window title bar 的 background color。设为
#: none 时默认为相应的 tab bar 颜色（active_tab_background）。

# window_title_bar_inactive_foreground none

#: 非活动 window title bar 的 foreground color。设为
#: none 时默认为相应的 tab bar 颜色（inactive_tab_foreground）。

# window_title_bar_inactive_background none

#: 非活动 window title bar 的 background color。设为
#: none 时默认为相应的 tab bar 颜色（inactive_tab_background）。

# window_title_bar_align center

#: window title bar 中文本的水平对齐方式。

#: }}}

#: Tab bar {{{

# tab_bar_edge bottom

#: 显示 tab bar 的边缘：top、bottom、left 或 right。

# tab_bar_margin_width 0.0

#: 垂直于 tab bar 边缘的 margin（以 pts 为单位）。对于
#: 顶部或底部的 tab bar，这是左侧和右侧的 margin。对于
#: 左侧或右侧的 tab bar，这是上方和下方的 margin。

# tab_bar_margin_height 0.0 0.0

#: 沿 tab bar 边缘的 margin（以 pts 为单位）。第一个数字是
#: OS window 边缘与 tab bar 之间的 margin。
#: 第二个数字是 tab bar 与当前 tab
#: 内容之间的 margin。

tab_bar_style powerline

#: tab bar 样式，可以是：

#: fade
#:     每个 tab 的边缘淡入 background color。（另见 tab_fade）
#: slant
#:     tab 看起来像实体文件夹中的标签。
#: separator
#:     tab 由可配置的 separator 分隔。（另见
#:     tab_separator）
#: powerline
#:     tab 显示为带有"花哨"separator 的连续线条。
#:     （另见 tab_powerline_style）
#: custom
#:     从 kitty config 目录中的 tab_bar.py 文件加载
#:     用户提供的名为 draw_tab 的 Python 函数。有关如何
#:     编写此类函数的示例，请参见
#:     kitty 源代码中名为 draw_tab_with_* 的函数：kitty/tab_bar.py。另见
#:     此讨论 <https://github.com/kovidgoyal/kitty/discussions/4447>
#:     中的 kitty 用户示例。
#: hidden
#:     tab bar 被隐藏。如果使用此选项，你可能想为
#:     select_tab action 创建映射，它会显示
#:     tab 列表并允许轻松切换到某个 tab。

# tab_bar_filter

#: 一个 search expression <https://sw.kovidgoyal.net/kitty/remote-
#: control/#search-syntax>。只有匹配此表达式的 tab 才会
#: 显示在 tab bar 中。当前活动 tab 始终显示，
#: 无论是否匹配。使用此选项时，
#: tab bar 显示的 tab 可能少于
#: tab_bar_min_tabs 中指定的数量，因为评估 filter 代价高昂，
#: 只在显示时执行。这在
#: 使用 sessions <https://sw.kovidgoyal.net/kitty/sessions/> 时最有用。
#: 表达式
#: session:~ 或 session:^$ 将只显示属于
#: 当前 session 或不属于任何 session 的 tab。goto_tab、next_tab、previous_tab
#: 等
#: 各种 tab 导航 action
#: 会自动限制为只对匹配的 tab 生效。

# tab_bar_align start

#: tab bar 的对齐方式，可以是：start、center、end、
#: left、right 之一。值 left 和 right 分别是 start 和
#: end 的别名。

# tab_bar_show_new_tab_button no

#: 设为 yes 时，tab bar 末尾始终显示一个 + button，
#: 作为打开新 tab 的可点击快捷键。设为 no（
#: 默认值）时，button 在静止时隐藏，但在
#: 拖动 window 时仍会暂时出现，因此可以将其用作
#: 拖放目标，在新 tab 中打开 window。

# tab_bar_min_tabs 2

#: 显示 tab bar 之前必须存在的最少 tab 数。

# tab_switch_strategy previous

#: 当前 tab 关闭时切换到某个 tab 所用的算法。默认值 previous
#: 会切换到最近使用的
#: tab。值 left 会切换到已关闭 tab 左侧的
#: tab。值 right 会切换到已关闭 tab 右侧的
#: tab。值 last 会切换到最右侧的 tab。

# tab_fade 0.25 0.5 0.75 1

#: 在 tab_bar_style 使用 fade 时控制每个 tab 如何淡入
#: background。每个数字是一个 alpha（介于零
#: 和一之间），控制相应 cell 淡入
#: background 的程度，零为不淡出，一为完全淡出。你可以
#: 通过向此列表添加/删除条目来更改使用的 cell 数。

# tab_separator " ┇"

#: 使用 separator 作为
#: tab_bar_style 时，tab bar 中 tab 之间的分隔符。

tab_powerline_style round

#: 使用 powerline 作为 tab_bar_style 时，tab bar 中 tab 之间的 powerline 分隔符样式，可以是：
#: angled、slanted、round 之一。

# tab_activity_symbol none

#: 如果 tab 中某个未聚焦的 window 有一些活动，
#: 在 tab 上显示的一些文本或 Unicode 符号。如果你想使用前导
#: 或尾随空格，请用引号将文本括起来。参见
#: tab_title_template 了解其渲染方式。

# tab_title_max_length 0

#: 渲染 tab 中文本可用的最大 cell 数。
#: 值为零表示不应用限制。对于垂直
#: tab bar，当此值未设置时，kitty 使用适合大约二十个
#: title cell 的默认侧边栏宽度。

# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}"

#: 渲染 tab title 的模板。默认只渲染
#: title，并带有可选的 bell 和 activity 符号。如果你想
#: 也包含 tab 索引，可以使用类似 {index}:{title} 的内容。
#: 如果你为 goto_tab N 映射了快捷键，这会很有用。如果你更喜欢
#: 将索引显示为上标，请使用 {sup.index}。所有可用数据
#: 为：

#: title
#:     当前 tab title。
#: index
#:     可用于 goto_tab N goto_tab 快捷键的 tab 索引。
#: layout_name
#:     当前 layout 名称。
#: session_name
#:     创建此 tab 所用的 kitty session 文件名称（如果有）。
#: active_session_name
#:     创建此 tab 中活动 window 所用的 kitty session 文件名称（如果有）。
#: num_windows
#:     tab 中 window 的数量。
#: num_window_groups
#:     tab 中 window group 的数量（window group 是一个 window 及其所有 overlay window）。
#: secure_input_symbol
#:     macOS 上启用 secure input 且该 tab 是活动 tab 时显示键符号，否则为空。
#: tab.active_wd
#:     tab 中当前活动 window 的工作目录
#:     （代价高昂，需要 syscall）。使用 tab.active_oldest_wd 获取
#:     最旧前台进程的目录，而不是最新的。
#: tab.active_exe
#:     tab 中当前
#:     活动 window 前台运行的可执行文件名称（代价高昂，需要 syscall）。使用
#:     tab.active_oldest_exe 获取最旧的前台进程。
#: max_title_length
#:     可用的最大 title 长度。
#: keyboard_mode
#:     当前 keyboard mode <https://sw.kovidgoyal.net/kitty/mapping/#modal-mappings> 的名称，如果没有活动的 keyboard mode 则为空字符串。
#: tab.last_focused_progress_percent
#:     如果 window 中运行的命令报告了任务进度，以百分比
#:     显示来自 tab 中最近聚焦 window 的进度。如果没有报告进度则为空字符串。
#: tab.progress_percent
#:     如果 window 中运行的命令报告了任务进度，以百分比
#:     显示来自 tab 中所有 window 的进度平均值。如果没有报告进度则为空字符串。
#: custom
#:     这将调用放在 kitty config 目录中 tab_bar.py 文件里的名为 draw_title(data) 的函数。
#:     该函数会收到一个数据字典，与
#:     此模板中可用的数据相同。然后它可以执行任意复杂的处理并返回一个字符串。
#:     例如：tab_title_template "{custom}" 将使用该函数的输出作为 tab title。
#:     draw_title() 中的任何 print 语句都会打印到 kitty 进程的 STDOUT，
#:     便于调试。


#: 注意格式化由 Python 的字符串格式化
#: 机制完成，因此你可以使用例如 {layout_name[:2].upper()}
#: 只显示 layout 名称的前两个字母（大写）。
#: 如果你想设置文本样式，可以使用样式指令，
#: 例如：
#: `{fmt.fg.red}red{fmt.fg.tab}normal{fmt.bg._00FF00}greenbg{fmt.bg.tab}`。
#: 类似地，对于 bold 和 italic：
#: `{fmt.bold}bold{fmt.nobold}normal{fmt.italic}italic{fmt.noitalic}`。
#: 256 个 terminal 颜色可以以 `fmt.fg.color0`
#: 到 `fmt.fg.color255` 的形式使用。注意为了向后兼容，如果
#: 模板中不存在 {bell_symbol} 或 {activity_symbol}，
#: 它们会被前置到模板。

# active_tab_title_template none

#: 用于活动 tab 的模板。如果未指定，回退到
#: tab_title_template。

# active_tab_foreground   #000
# active_tab_background   #eee
# active_tab_font_style   bold-italic
# inactive_tab_foreground #444
# inactive_tab_background #999
# inactive_tab_font_style normal

#: Tab bar 颜色和样式。

# tab_bar_background none

#: tab bar 的 background color。默认使用 terminal
#: background color。

# tab_bar_margin_color none

#: tab bar margin 区域的颜色。默认使用
#: terminal background color 作为 tab bar 上方和下方的 margin。
#: 对于侧边
#: margin，默认颜色选择为匹配
#: 相邻 tab 的 background color，除非 window 是半透明的，
#: 在这种情况下使用默认 background，因为看起来更好。

#: }}}

#: Color scheme {{{

# foreground #dddddd
# background #000000

#: foreground 和 background 颜色。

#: background_opacity 0.975

#: terminal background color 的不透明度。介于零
#: 和一之间的数字，一为不透明，零为完全透明。这
#: 只有在操作系统支持时才有效（例如，在 X11 下
#: 使用 compositor 时）。注意它只设置
#: 与默认 terminal background 具有相同 background color 的 cell
#: 中 background color 的不透明度，
#: 这样 vim 中的状态栏、powerline prompt 等
#: 看起来仍然不错。但这意味着如果你
#: 在编辑器中使用带 background color 的颜色主题，
#: 它不会渲染为透明。相反，你应该
#: 更改 kitty config 中的默认 background color，而不要在
#: 编辑器配色方案中使用 background color。或者使用 escape
#: code 在启动编辑器的 shell 脚本中设置
#: terminal 的默认颜色。另见 transparent_background_colors。请
#: 注意使用小于 1.0 的值是一个（可能显著的）
#: 性能损失。为此设置使用较低值时，最好
#: 将 background color 设置为与
#: 桌面背景总体颜色匹配的颜色，以获得最佳文本
#: 渲染。另请注意，此设置不适用于
#: background_image（如果有）。background image 本身可以
#: 通过其 alpha channel 具有透明度（如果需要），
#: 并且会得到尊重。

#: 如果你想动态更改 window 的透明度，请将
#: dynamic_background_opacity 设为 yes（默认关闭，因为它有
#: 性能成本）。重新加载 config 时更改此选项
#: 只有在原始 config 中启用了
#: dynamic_background_opacity 时才有效。

# background_blur 20

#: 设为正值以在支持的平台
#: 上启用 background blur（模糊透明 window 后面的
#: 视觉内容）。
#: 仅在 background_opacity 小于一时生效。在
#: macOS 上，这还将控制 blur 半径（模糊量）。
#: 将其设为过高的值会导致严重的性能问题
#: 和/或渲染伪影。通常，最高 64 的值效果不错。
#: 注意这可能会导致性能问题，具体取决于
#: 平台的实现方式，请谨慎使用。目前支持
#: macOS 和 Wayland（当 compositor 支持 background blur
#: 扩展时）。

# transparent_background_colors

#: 最多 7 种颜色的空格分隔列表，带不透明度。当
#: cell 的 background color 匹配其中一种颜色时，
#: 使用指定的不透明度将其渲染为半透明。

#: 在编辑器等更复杂的 UI 中很有用，你可能希望
#: 将不止一种 background color 渲染为透明，例如
#: 用于 cursor 高亮行背景或高亮
#: 块。Terminal 应用程序可以使用 kitty
#: color control <https://sw.kovidgoyal.net/kitty/color-stack/#color-
#: control> escape code 设置此颜色。

#: 指定颜色的语法是：color@opacity，其中
#: @opacity 部分是可选的。未指定时，使用
#: background_opacity 的值。例如::

#:     transparent_background_colors red@0.5 #00ff00@0.3

#: 注意你还必须将 background_opacity 设置为小于
#: 1 的值，此设置才能正常工作。

# dynamic_background_opacity no

#: 允许使用键盘快捷键（increase_background_opacity 和
#: decrease_background_opacity）或 remote control 机制
#: 动态更改 background_opacity。
#: 不支持通过重新加载 config 更改此选项。

# background_image none

#: 匹配一个或多个 background image 的 Glob pattern。必须是
#: PNG/JPEG/WEBP/TIFF/GIF/BMP 格式。第一个用作
#: 默认 image。多个 image 存储在 GPU VRAM 中（按需），
#: 因此它们之间的切换是即时的。要在
#: background image 列表中的 image 之间移动，请使用 remote
#: control 命令 set-background-image，详情参见 `kitten set-background-
#: image --help`。你可以像这样将命令映射到键：
#: map f1 remote_control set-background-image +1。注意使用 auto_color_scheme
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 时，此选项会被 color scheme 文件覆盖，必须
#: 在其中设置才能生效。

# background_image_layout tiled

#: 是否平铺、缩放或钳制 background image。值可以
#: 是 tiled、mirror-tiled、scaled、clamped、centered 或
#: cscaled 之一。scaled 和 cscaled 值将 image 缩放到
#: window 大小，cscaled 保持 image 宽高比。注意
#: 使用 auto_color_scheme
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 时，此选项会被 color scheme 文件覆盖，必须
#: 在其中设置才能生效。

# background_image_linear no

#: 当 background image 被缩放时，是否应使用
#: 线性插值。注意使用 auto_color_scheme
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 时，此选项会被 color scheme 文件覆盖，必须
#: 在其中设置才能生效。

# background_tint 0.0

#: 用 background color 对 background image 着色多少。此
#: 选项使文本更易于阅读。着色使用
#: 每个 window 当前的 background color 完成。此选项仅在
#: 设置了 background_image 时适用。注意使用 auto_color_scheme
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 时，此选项会被 color scheme 文件覆盖，必须
#: 在其中设置才能生效。

# background_tint_gaps 1.0

#: 应用 background_tint 之后，在 window 间隙处
#: 用 background color 对 background image 着色多少。由于这是
#: 与 background_tint 相乘的，可用于淡化
#: window 间隙上的着色，以获得*分离*的外观。注意使用
#: auto_color_scheme
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 时，此选项会被 color scheme 文件覆盖，必须
#: 在其中设置才能生效。

# dim_opacity 0.4

#: 对设置了 DIM/FAINT attribute 的文本调暗多少。一
#: 表示不调暗，零表示完全调暗（即不可见）。

# selection_foreground #000000
# selection_background #fffacd

#: 用 mouse 选择的文本的 foreground 和 background 颜色。
#: 将两者都设为 none 会对 selection 产生"reverse video"
#: 效果，即 selection 将是 cell 文本
#: 颜色，而文本将变成 cell background 颜色。只将
#: selection_foreground 设为 none 会使 foreground color
#: 保持不变。注意这些颜色可以被
#: terminal 中运行的程序覆盖。

# palette_generate fixed

#: 如何填充 256 色 palette 中未设置（设为 none）的任何颜色。默认情况下，为了
#: 旧版兼容性，这些颜色
#: 被设置为历史 terminal 使用的固定值集合。

#: 相反，你可以让 kitty 根据前 16 种
#: 颜色生成它们 <https://gist.github.com/jake-
#: stewart/0a8ea46159a7da2c808e5be2177e1783>。

#: 值 semantic 表示使用一种算法，在浅色主题中
#: 提供良好的可读性，但会改变某些颜色的含义
#: 与固定颜色编码相比。值 legacy 在浅色主题中
#: 可读性较差，但偏离固定颜色编码较少。

#: The color table {{{

#: 256 种 terminal 颜色。有 8 种基本颜色，前 16 种颜色中每种颜色都有
#: 暗淡和明亮版本。你可以将
#: 其余 240 种颜色设置为 color16 到 color255。

# color0 #000000
# color8 #767676

#: black

# color1 #cc0403
# color9 #f2201f

#: red

# color2  #19cb00
# color10 #23fd00

#: green

# color3  #cecb00
# color11 #fffd00

#: yellow

# color4  #0d73cc
# color12 #1a8fff

#: blue

# color5  #cb1ed1
# color13 #fd28ff

#: magenta

# color6  #0dcdcd
# color14 #14ffff

#: cyan

# color7  #dddddd
# color15 #ffffff

#: white

# mark1_foreground black

#: type 1 mark 的颜色

# mark1_background #98d3cb

#: type 1 mark 的颜色（light steel blue）

# mark2_foreground black

#: type 2 mark 的颜色

# mark2_background #f2dcd3

#: type 1 mark 的颜色（beige）

# mark3_foreground black

#: type 3 mark 的颜色

# mark3_background #f274bc

#: type 3 mark 的颜色（violet）

#: }}}

#: Wide gamut color formats {{{

#: kitty 支持现代 wide gamut color 格式，包括用于精确
#: 颜色规格的 OKLCH 和
#: CIE LAB。这些格式可以在
#: 任何接受颜色值的地方使用（foreground、background、
#: color0-color255 等）。

#: 有关 wide gamut color 格式、语法和
#: 示例的详细文档，请参阅 /wide-gamut-colors
#: <https://sw.kovidgoyal.net/kitty/wide-gamut-colors/>。

#: }}}

#: }}}

#: Advanced {{{

shell /usr/bin/zsh

#: 要执行的 shell 程序。默认值 . 表示使用
#: SHELL 环境变量的值，如果未设置，
#: 则使用当前用户的默认 shell。
#: 注意在 macOS 上，如果你更改此项，可能需要添加
#: --login 和 --interactive 以确保 shell 以
#: interactive 模式启动并读取其启动 rc 文件。此设置中
#: 会展开环境变量。

editor nvim

#: 编辑 kitty config 文件或类似任务时使用的
#: 基于 terminal 的文本编辑器（如 vim 或 nano）。

#: 默认值 . 表示按顺序使用环境变量
#: VISUAL 和 EDITOR。如果这些变量未设置，
#: kitty 将运行你的 shell（$SHELL -l -i -c env）以查看
#: 你的 shell 启动 rc 文件是否设置了 VISUAL 或 EDITOR。如果这不起作用，
#: kitty 将依次尝试各种已知编辑器（vim、emacs 等），
#: 并采用你系统上存在的第一个。

# close_on_child_death no

#: 子进程（通常是 shell）退出时关闭 window。
#: 使用默认值 no 时，只要
#: 仍有其他进程向 terminal 输出（例如
#: disowned 或后台进程），子进程退出后
#: terminal 将保持打开。使用
#: yes 启用时，子进程一退出
#: window 就会关闭。注意设为 yes 意味着
#: 任何仍在使用 terminal 的后台进程都可能静默失败，
#: 因为它们的 stdout/stderr/stdin 不再工作。

# remote_control_password

#: 允许其他程序使用密码控制 kitty。此选项
#: 可以多次指定以添加多个密码。如果没有
#: 密码，程序尝试使用密码进行
#: remote control 时，kitty 会询问用户是否允许。密码还可以
#: *可选地*与一组允许的 remote
#: control action 关联。例如::

#:     remote_control_password "my passphrase" get-colors set-colors focus-window focus-tab

#: 使用此密码时只允许指定的 action。
#: 也可以使用 Glob pattern，例如::

#:     remote_control_password "my passphrase" set-tab-* resize-*

#: 要获取可用 action 列表，运行::

#:     kitten @ --help

#: 可以通过使用空密码来指定
#: 未发送密码时允许的一组 action。例如::

#:     remote_control_password "" *-colors

#: 最后，可以指定一个 Python 模块的路径，它提供
#: 一个 is_cmd_allowed 函数，用于检查每个 remote
#: control 命令。例如::

#:     remote_control_password "my passphrase" my_rc_command_checker.py

#: 相对路径从 kitty 配置目录解析。
#: 详情参见 rc_custom_auth <https://sw.kovidgoyal.net/kitty/remote-
#: control/#rc-custom-auth>。

# allow_remote_control no

#: 允许其他程序控制 kitty。如果开启此选项，其他
#: 程序可以控制 kitty 的所有方面，包括向
#: kitty window 发送文本、打开新 window、关闭 window、读取
#: window 的内容等。注意这甚至可以通过 SSH
#: 连接工作。默认设置 no 会阻止任何形式的 remote
#: control。各种值的含义是：

#: password
#:     通过 TTY 设备和 socket 收到的 remote control 请求
#:     都基于密码确认，参见 remote_control_password。

#: socket-only
#:     通过 socket 收到的 remote control 请求被无条件
#:     接受。通过 TTY 收到的请求被拒绝。
#:     参见 listen_on。

#: socket
#:     通过 socket 收到的 remote control 请求被无条件
#:     接受。通过 TTY 收到的请求基于
#:     密码确认。

#: no
#:     Remote control 被完全禁用。

#: yes
#:     Remote control 请求总是被接受。

# listen_on none

#: 监听指定的 socket 以进行 remote control 连接。注意
#: 这将适用于所有 kitty 实例。它可以被
#: kitty --listen-on 命令行选项覆盖。对于 UNIX socket，
#: 例如 unix:${TEMP}/mykitty 或 unix:@mykitty（在 Linux 上）。
#: 环境变量会被展开，相对路径相对于
#: 临时目录解析。如果存在 {kitty_pid}，
#: 则将其替换为 kitty 进程的 PID，否则
#: kitty 进程的 PID 以连字符追加到值上。
#: 对于 tcp:localhost:0 之类的 TCP socket，即使
#: 指定了非零端口号，也总是使用随机端口。更多详情
#: 参见 kitty --listen-on 的帮助。注意除非
#: allow_remote_control 设置为：yes、socket 或
#: socket-only 之一，否则将忽略此选项。不支持
#: 通过重新加载 config 更改此选项。

# env

#: 指定要在所有子进程中设置的环境变量。
#: 使用带等号的名称（例如 env VAR=）会将其设置为
#: 空字符串。只指定名称（例如 env VAR）会
#: 从子进程环境中移除该变量。注意
#: 环境变量会递归展开，例如::

#:     env VAR1=a
#:     env VAR2=${HOME}/${VAR1}/b

#: VAR2 的值将是 <path to home directory>/a/b。

#: 使用特殊值 read_from_shell 让 kitty 从
#: 你的登录 shell 配置中读取指定的变量。
#: 如果你的 shell 启动文件设置了一堆你希望
#: kitty 和 kitty session
#: 文件可用的环境变量，这会很有用。每个变量名称都作为要匹配的 glob pattern
#: 处理。
#: 例如：env read_from_shell=PATH LANG LC_* XDG_* EDITOR
#: VISUAL。注意这些变量只在
#: 配置完全处理后读取，因此它们不能用于
#: 递归展开，并且会覆盖
#: 其他 env 指令设置的任何变量。

# filter_notification

#: 指定规则以过滤掉 kitty 中运行的应用程序
#: 发送的通知。可以多次指定以创建
#: 多个过滤规则。规则规范的形式是
#: field:regexp。过滤规则可以匹配任何字段：title、
#: body、app、type。特殊值 all 过滤掉所有
#: 通知。规则可以使用 Boolean 运算符组合。一些
#: 示例::

#:     filter_notification title:hello or body:"abc.*def"
#:     # 过滤掉来自 vim 的通知，除了关于更新的通知，(?i)
#:     # 使匹配不区分大小写。
#:     filter_notification app:"[ng]?vim" and not body:"(?i)update"
#:     # 过滤掉所有通知
#:     filter_notification all

#: 字段 app 是发送
#: 通知的应用程序名称，type 是通知的类型。并非所有
#: 应用程序都会发送这些字段，因此你也可以匹配
#: 通知文本的 title 和 body。更复杂的
#: 程序化过滤和通知的自定义操作可以
#: 通过在 kitty config
#: 目录（~/.config/kitty）中创建 notifications.py 文件来完成。有一个带注释的示例
#: <https://github.com/kovidgoyal/kitty/blob/master/docs/notifications.py>。

# watcher

#: 将为 watcher 加载的 Python 文件路径
#: <https://sw.kovidgoyal.net/kitty/launch/#watchers>。可以
#: 多次指定以加载多个 watcher。watcher
#: 将被添加到每个 kitty window。相对路径相对于
#: kitty config 目录解析。注意重新加载
#: config 只会影响重新加载后创建的 window。

# exe_search_path

#: 控制 kitty 在哪里查找要运行的程序。默认搜索
#: 顺序是：首先搜索系统范围的 PATH，然后搜索 ~/.local/bin 和
#: ~/bin。如果仍未找到，则尝试在登录 shell
#: source 其所有启动文件后定义的 PATH。最后，如果存在，
#: 则尝试 env 选项指定的 PATH。

#: 此选项允许你在此
#: 搜索顺序中前置、追加或移除路径。它可以多次指定以
#: 添加多个路径。简单路径将前置到搜索顺序。以
#: + 号开头的路径将追加到搜索顺序，
#: 在上述 ~/bin 之后。以 - 号开头的路径将
#: 从整个搜索顺序中移除。例如::

#:     exe_search_path /some/prepended/path
#:     exe_search_path +/some/appended/path
#:     exe_search_path -/some/excluded/path

# update_check_interval 24

#: 定期检查 kitty 是否有更新的间隔
#: （以小时为单位）。如果发现更新，会显示系统通知
#: 告知你可用的更新。默认是
#: 每 24 小时检查一次，设为零可禁用。更新检查
#: 只由官方二进制构建执行。发行版包或源码
#: 构建不进行更新检查。不支持
#: 通过重新加载 config 更改此选项。

# auto_reload_config 0.1

#: 配置文件更改时自动重新加载。该
#: 设置是重新加载 config
#: 文件前等待的秒数。这允许对多次更改进行去抖。使用
#: 负值禁用自动重新加载。你可以手动
#: 使用 reload_config_file 重新加载。注意只有在
#: kitty 启动时 kitty.conf 已经存在，自动重新加载才有效。
#: 通过重新加载配置更改此设置会被忽略。

# startup_session none

#: 用于所有 kitty 实例的 session 文件路径。可以通过
#: 使用 kitty --session =none 命令行选项
#: 为单个实例覆盖。详情参见 kitty
#: 文档中的 sessions
#: <https://sw.kovidgoyal.net/kitty/sessions/>。注意相对路径
#: 相对于 kitty config 目录解释。
#: 路径中的环境变量会被展开。不支持
#: 通过重新加载 config 更改此选项。注意如果 kitty
#: 使用指定要运行命令的命令行参数调用，
#: 则忽略此选项。

# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

#: 允许 kitty 中运行的程序读写
#: clipboard。你可以精确控制允许哪些 action。可能的
#: action 有：write-clipboard、read-clipboard、write-
#: primary、read-primary、read-clipboard-ask、read-primary-ask。
#: 默认是允许写入 clipboard 和 primary selection，
#: 并在程序尝试从
#: clipboard 读取时请求许可。注意禁用读取确认是一个
#: 安全风险，因为这意味着任何程序，甚至
#: 通过 SSH 在远程服务器上运行的程序，都可以读取你的 clipboard。另见
#: clipboard_max_size。

# clipboard_max_size 512

#: 将存储用于写入 system clipboard 的
#: kitty 中运行的程序数据的最大大小（以 MB 为单位）。
#: 值为零表示不应用大小限制。另见 clipboard_control。

# file_transfer_confirmation_bypass

#: 可以提供给 file transfer kitten
#: <https://sw.kovidgoyal.net/kitty/kittens/transfer/> 以跳过
#: transfer 确认提示的密码。这只应在
#: 从可信计算机、通过可信网络
#: 或加密传输发起 transfer 时使用，因为它允许远程
#: 机器上运行的任何程序在未经
#: 许可的情况下读写本地文件系统。

# allow_hyperlinks yes

#: 处理 hyperlink escape sequence（OSC 8）。如果禁用，OSC 8
#: escape sequence 将被忽略。否则它们会变成可点击的
#: 链接，你可以用 mouse 或通过 hints
#: kitten <https://sw.kovidgoyal.net/kitty/kittens/hints/> 点击。特殊值
#: ask 表示点击链接时 kitty 会在打开
#: 链接前询问。

# shell_integration enabled

#: 在支持的 shell 上启用 shell integration。这启用了
#: 跳转到之前的 prompt、在 pager 中浏览上一条
#: 命令的输出等功能。
#: 设为 disabled 可完全关闭 shell integration。也可以
#: 禁用单个功能，设为这些值的空格分隔
#: 列表：no-rc、no-cursor、no-title、no-cwd、no-
#: prompt-mark、no-complete、no-sudo。详情参见 Shell integration
#: <https://sw.kovidgoyal.net/kitty/shell-integration/>。

# allow_cloning ask

#: 控制 terminal 中运行的程序是否可以请求
#: 创建新 window。典型示例是 clone-in-kitty
#: <https://sw.kovidgoyal.net/kitty/shell-integration/#clone-shell>。
#: 默认情况下，kitty 会对每个 clone 请求请求许可。
#: 无条件允许克隆会赋予 terminal
#: 中运行的程序（包括通过 SSH 的）以
#: 运行该 terminal 的用户身份，在该 terminal 所运行的
#: 计算机上执行任意代码的权限。

# clone_source_strategies venv,conda,env_var,path

#: 控制在新克隆的 window 中运行 clone-in-kitty 时
#: source 哪些 shell 代码。支持的策略是：

#: venv
#:     Source 文件 $VIRTUAL_ENV/bin/activate。这被 Python
#:     stdlib venv 模块使用，允许自动克隆 venv。
#: conda
#:     运行 conda activate $CONDA_DEFAULT_ENV。这支持 conda
#:     创建的虚拟环境。
#: env_var
#:     使用 eval 执行环境变量
#:     KITTY_CLONE_SOURCE_CODE 的内容。
#: path
#:     Source 环境变量
#:     KITTY_CLONE_SOURCE_PATH 指向的文件。

#: 此选项必须是上述值的逗号分隔列表。
#: 只 source 按指定顺序的第一个有效匹配。

# notify_on_cmd_finish never

#: 长时间运行的命令完成时显示桌面通知
#: （需要 shell_integration）。可能的值是：

#: never
#:     从不发送通知。

#: unfocused
#:     仅当 window 没有键盘 focus 时发送通知。

#: invisible
#:     仅当 window 既未聚焦又对用户不可见时发送通知，
#:      例如，因为它位于非活动 tab 中或其 OS window
#:      当前不可见（在支持 OS window 可见性查询的平台上，
#:      仅当 OS window 活动时才认为它可见）。

#: always
#:     无论 window 状态如何，总是发送通知。

#: 有两个可选参数：

#: 首先，被视为长时间运行命令的最短持续时间。
#: 默认是 5 秒。指定第二个参数以设置
#: 持续时间。例如：invisible 15。不要将值设置得太
#: 小，否则启动新 OS window 然后退出的命令
#: 会刷屏通知。

#: 其次，要执行的操作。默认是 notify。可能的
#: 值有：

#: notify
#:     发送桌面通知。后续参数是可选的，指定
#:      通知何时自动清除。通知被
#:      清除的可能事件集合是：focus 和 next。focus 表示当通知
#:      策略为 unfocused 或 invisible 时，通知
#:      在 window 重新获得 focus 时自动清除。值 next 表示
#:      显示下一条通知时清除上一条通知。未指定参数时的默认值
#:      是：focus next。

#: bell
#:     响 terminal bell。

#: notify-bell
#:     发送桌面通知并响 terminal bell。
#:      参数与 `notify` 相同。

#: command
#:     运行自定义命令。所有后续参数是要运行的 cmdline。

#: 更多示例::

#:     # 在未聚焦 window 中命令耗时超过 5 秒时发送通知
#:     notify_on_cmd_finish unfocused
#:     # 在不可见 window 中命令耗时超过 10 秒时发送通知
#:     notify_on_cmd_finish invisible 10.0
#:     # 在不可见 window 中命令耗时超过 10 秒时响铃
#:     notify_on_cmd_finish invisible 10.0 bell
#:     # 在不可见 window 中命令耗时超过 10 秒时运行 'notify-send'
#:     # 这里 %c 被替换为当前命令行，%s 被替换为作业退出码
#:     notify_on_cmd_finish invisible 10.0 command notify-send "job finished with status: %s" %c
#:     # 下一条命令完成或 window 重新获得 focus 时不清除上一条通知
#:     notify_on_cmd_finish invisible 5.0 notify

# term xterm-kitty

#: 要设置的 TERM 环境变量的值。更改此值
#: 会破坏许多 terminal 程序，只有在你
#: 知道自己在做什么时才更改它，不要因为你看到
#: "Stack Overflow" 上的建议就更改。TERM 变量被各种程序用来获取
#: terminal 能力和行为的信息。如果
#: 你更改它，根据你运行的程序以及
#: 你更改为的 terminal 与当前 terminal 的差异程度，
#: 从按键到颜色再到各种高级功能
#: 都可能无法工作。通过重新加载 config 更改此选项
#: 只会影响新建的 window。

# terminfo_type path

#: 要设置的 TERMINFO 环境变量的值。此
#: 变量被 terminal 中运行的程序用来搜索
#: terminfo 数据库。默认值 path 使 kitty 将
#: 其设置为包含 kitty terminfo 数据库的文件系统位置。
#: 值 direct 表示将整个数据库直接放入环境变量。
#: 例如，在连接到容器时这很有用。
#: 但请注意，并非所有软件都支持此功能。值
#: none 表示不触碰该变量。

# forward_stdio no

#: 将 kitty 进程的 STDOUT 和 STDERR 转发给子进程。
#: 这对调试很有用，因为它允许子进程直接打印
#: 到 kitty 的 STDOUT。例如，在 shell 中执行 echo hello world
#: >&$KITTY_STDIO_FORWARDED 会打印到父级
#: kitty 的 STDOUT。设置 KITTY_STDIO_FORWARDED=fdnum 环境
#: 变量，以便子进程知道转发情况。注意在
#: macOS 上这会阻止 shell 通过 login 工具运行，
#: 因此 getlogin() 在此 session 中运行的程序中将无法工作。

# menu_map

#: 为 kitty 中的各种菜单指定条目。目前只支持
#: macOS 上的全局 menubar。例如::

#:    menu_map global "Actions::Launch something special" launch --hold --type=os-window sh -c "echo hello world"

#: 这将在 macOS 全局 menubar 的 "Actions"
#: 菜单中创建一个名为 "Launch something special" 的菜单条目。可以通过
#: 添加由 :: 字符分隔的更多层级来创建
#: 子菜单。

#: }}}

#: OS specific tweaks {{{

# wayland_titlebar_color system

#: 在具有
#: client side window decorations 的 Wayland 系统（如 GNOME）上，kitty window titlebar 的颜色。值 system
#: 表示使用默认系统颜色，值 background 表示
#: 使用当前活动 kitty window 的 background color，
#: 最后你可以使用任意颜色，例如 #12af59 或 red。

# macos_titlebar_color system

#: macOS 上 kitty window titlebar 的颜色。值
#: system 表示使用默认系统颜色，也可以使用 light 或 dark
#: 显式设置。值 background 表示
#: 使用当前活动 window 的 background color，最后
#: 你可以使用任意颜色，例如 #12af59 或 red。

#: 注意使用 auto_color_scheme
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 时，此选项会被 color scheme 文件覆盖，必须
#: 在其中设置才能生效。

# macos_option_as_alt no

#: 在 macOS 上使用 Option 键作为 Alt 键。将此设为 no 时，
#: kitty 将使用 macOS 原生的 Option+Key 输入 Unicode
#: 字符行为。这会破坏 terminal
#: 程序中的任何 Alt+Key 键盘快捷键，但你可以使用 macOS Unicode input
#: 技术。你可以使用 left、right 或 both 这些值，只将
#: 左侧、右侧或两侧 Option 键用作 Alt。注意
#: kitty 本身始终将 Option 视为与 Alt 相同。这意味着
#: 你不能使用此选项为
#: Option+Key 与 Alt+Key 配置不同的 kitty 快捷键。此外，任何使用
#: Option/Alt+Key 的 kitty 快捷键都将优先，因此此类按键
#: 不会传递给 kitty 内部运行的 terminal 程序。
#: 不支持通过重新加载 config 更改此选项。

# macos_hide_from_tasks no

#: 在 macOS 上从运行任务中隐藏 kitty window（⌘+Tab 和
#: Dock）。不支持通过重新加载 config 更改此
#: 选项。

# macos_quit_when_last_window_closed no

#: 在 macOS 上关闭所有顶级 window 时让 kitty
#: 退出。默认情况下，即使没有打开 window，
#: kitty 也会保持运行，这是 macOS 上的预期行为。

# macos_window_resizable yes

#: 如果你希望 kitty 顶级 OS window 在 macOS 上不可
#: 调整大小，请禁用此选项。

# macos_thicken_font 0

#: 在 font 周围绘制指定宽度的额外边框，以
#: 提高 macOS 上小字体大小的可读性。例如，值为
#: 0.75 会产生在常见字体大小下类似
#: 亚像素抗锯齿的渲染效果。注意在现代 kitty 中，
#: 此选项已过时（尽管仍受支持）。请考虑使用
#: text_composition_strategy。

# macos_traditional_fullscreen no

#: 使用 macOS 传统全屏过渡，它更快，
#: 但没那么漂亮。

# macos_fullscreen_ignore_safe_area_insets no

#: 使用 macos_traditional_fullscreen 时，忽略
#: 带 notch 的 MacBook 屏幕等显示器上的 safe area
#: insets。这允许 kitty 使用完整显示区域，而不是为
#: notch 区域留出空间。

# macos_use_physical_screen_frame no

#: 放置 macOS 桌面面板（如 kitty +kitten
#: panel 创建的面板）时，使用物理屏幕框架而不是可见框架。
#: 这允许面板绘制在通常保留给
#: 原生 menu bar 或 Dock 的区域。另见 macos_ns_window_layer。

# macos_ns_window_layer unset

#: 为新创建的面板 OS window 设置 macOS NSWindow level，
#: 例如使用 panel kitten
#: <https://sw.kovidgoyal.net/kitty/kittens/panel/> 时。默认值
#: unset 保持正常的 level 处理不变。值可以是整数
#: window level、AppKit/CoreGraphics window-level 常量名称，或
#: 将它们与整数组合的简单算术表达式。例如：
#: NSFloatingWindowLevel、kCGBackstopMenuLevel、
#: NSPopUpMenuWindowLevel - 1。另见
#: :macos_use_physical_screen_frame`。

# macos_show_window_title_in all

#: 控制 window title 在 macOS 上的显示位置。值
#: window 将在 macOS window
#: 顶部显示当前活动 window 的 title。值 menubar 将在 macOS 全局 menu bar 中显示
#: 当前活动 window 的 title，利用
#: 原本浪费的空间。值 all 将 title 显示在
#: 两个位置，none 隐藏 title。参见
#: macos_menubar_title_max_length 了解如何控制 menu bar 中
#: title 的长度。

# macos_menubar_title_max_length 0

#: 在 macOS 全局 menu bar 中显示的 window title 的最大字符数。
#: 小于一的数值表示没有
#: 最大限制。

# macos_custom_beam_cursor no

#: 为 macOS 使用自定义 mouse cursor，它在浅色
#: 和深色背景上都更易于看到。如今，默认 macOS cursor
#: 已经带有白色边框。WARNING：这可能使你的
#: mouse cursor 在双 GPU 机器上不可见。不支持
#: 通过重新加载 config 更改此选项。

# macos_colorspace srgb

#: 解释 terminal 颜色的 colorspace。默认
#: srgb 会使颜色与 Web 浏览器中看到的匹配。
#: 值 default 将使用显示器的任何原生 colorspace。
#: 值 displayp3 将使用 Apple 的特殊
#: 雪花显示 P3 color space，这会产生
#: 过饱和（更亮）的颜色并伴有一些色偏。重新加载
#: 配置只会对新创建的 OS
#: window 更改此值。

# linux_display_server auto

#: 在 Wayland 和 X11 后端之间选择。默认情况下，会根据系统状态自动选择适当的
#: 后端。将其设
#: 为 x11 或 wayland 以强制选择。不支持
#: 通过重新加载 config 更改此选项。

# wayland_enable_ime yes

#: 在 Wayland 上启用 Input Method Extension。这通常用于
#: 输入东亚语言文本。然而，其
#: 在 Wayland 中的实现经常有 bug 并给
#: 输入循环引入延迟，所以如果你知道自己不需要它，
#: 请禁用它。
#: 不支持通过重新加载 config 更改此选项，它
#: 不会产生任何效果。

#: }}}

#: Keyboard shortcuts {{{

#: 键简单地由其小写 Unicode 字符标识。
#: 例如：a 表示 A 键，[ 表示左方括号键，
#: 等等。对于功能键（如 Enter 或 Escape），名称
#: 见 Functional key definitions
#: <https://sw.kovidgoyal.net/kitty/keyboard-protocol/#functional>。
#: 对于 modifier 键，名称是 ctrl（control，⌃）、shift（⇧）、alt
#: （opt，option，⌥）、super（cmd，command，⌘）。

#: 简单的快捷键映射用 map 指令完成。有关
#: 包括 modal 和按应用程序映射在内的高级映射的完整细节，
#: 请参见 mapping <https://sw.kovidgoyal.net/kitty/mapping/>。一些
#: 说明常见任务的快速示例::

#:     # 取消映射键盘快捷键，将其传递给 kitty 中运行的程序
#:     map kitty_mod+space
#:     # 完全忽略键盘事件
#:     map ctrl+alt+f1 discard_event
#:     # 组合多个 action
#:     map kitty_mod+e combine : new_window : next_layout
#:     # 多键快捷键
#:     map ctrl+x>ctrl+y>z action

#: 对于非拉丁键盘布局（俄语、阿拉伯语等），
#: --allow-fallback 选项控制物理键回退。值：
#: shifted（默认 — 移位键回退）、ascii（备用键 /
#: 物理位置回退，仅适用于非 ASCII 键）、none（禁用
#: 所有回退），或逗号分隔的组合。所有默认
#: 快捷键都使用 --allow-fallback=shifted,ascii::

#:     map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard

#: 你可以通过按
#: command_palette 运行命令面板来浏览和触发这些 action。可以映射到按键的
#: action 完整列表
#: 在此 <https://sw.kovidgoyal.net/kitty/actions/> 可用。

# kitty_mod ctrl+shift

#: 默认快捷键的特殊 modifier 键别名。你可以更改
#: 此选项的值来更改所有使用
#: kitty_mod 的默认快捷键。

# clear_all_shortcuts no

#: 移除到此为止的所有快捷键定义。例如，可用于
#: 移除默认快捷键。

# map_timeout 0.0

#: 多键映射和 modal
#: 键盘模式的默认超时（以秒为单位）。如果你按下多键
#: 映射的第一个键，并且在此超时内没有按下下一个键，
#: 则映射被取消并退出该模式。值为零
#: 禁用超时。可以通过在使用
#: --new-mode 创建键盘模式时指定 --timeout 选项
#: 为特定模式覆盖此值。例如::

#:     # 所有映射的超时为 2 秒
#:     map_timeout 2.0

#:     # 此模式将有 5 秒超时（覆盖全局 2 秒超时）
#:     map --new-mode resize --timeout 5.0 kitty_mod+r

# action_alias

#: 例如：action_alias launch_tab launch --type=tab --cwd=current

#: 定义 action 别名，避免在
#: 多个映射中重复相同的选项。可以为任何 action 定义别名，并将
#: 递归展开。例如，上述别名允许你在当前工作
#: 目录中创建启动新 tab 的映射而无需
#: 重复::

#:     map f1 launch_tab vim
#:     map f2 launch_tab emacs

#: 类似地，要为 kitten 调用创建别名::

#:     action_alias hints kitten hints --hints-offset=0

# kitten_alias

#: 例如：kitten_alias hints hints --hints-offset=0

#: 与上面的 action_alias 类似，但专门针对 kitten。通常，
#: 更倾向于使用 action_alias。此选项是一个旧版，
#: 为了向后兼容而存在。它会使被别名化的 kitten 的所有调用
#: 都被替换。因此上面的示例
#: 会使 hints kitten 的所有调用
#: 都应用 --hints-
#: offset=0 选项。

#: Clipboard {{{

#: 复制到 clipboard

# map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard

#::  还有一个 copy_or_interrupt action，可以可选地
#::  映射到 Ctrl+C。它只在有 selection 时复制，
#::  否则发送 interrupt。类似地，
#::  copy_and_clear_or_interrupt 会复制并清除 selection，如果
#::  没有 selection 则发送 interrupt。copy_or_noop
#::  action 会在有 selection 时复制，如果没有
#::  selection 则将按键
#::  传递给 terminal 中运行的应用程序。

#: 复制到 clipboard 或直接传递

# map --allow-fallback=shifted,ascii cmd+c copy_or_noop

#: 从 clipboard 粘贴

# map --allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard
# map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard

#: 从 selection 粘贴

# map --allow-fallback=shifted,ascii kitty_mod+s paste_from_selection
# map shift+insert                   paste_from_selection

#: 将 selection 传递给程序

# map --allow-fallback=shifted,ascii kitty_mod+o pass_selection_to_program

#::  你也可以使用 pass_selection_to_program 将当前 selection 的内容传递给任何
#::  程序。默认情况下，使用系统的
#::  open 程序，但你可以指定自己的，selection
#::  将作为命令行参数传递给程序。例如::

#::      map kitty_mod+o pass_selection_to_program firefox

#::  你可以使用 @selection 占位符将当前 selection
#::  传递给新 kitty window 中运行的 terminal 程序::

#::      map kitty_mod+y new_window less @selection

#: }}}

#: Scrolling {{{

#: 向上滚动一行

# map kitty_mod+up                   scroll_line_up smooth
# map --allow-fallback=shifted,ascii kitty_mod+k scroll_line_up smooth
# map opt+cmd+page_up                scroll_line_up smooth
# map cmd+up                         scroll_line_up smooth

#: 向下滚动一行

# map kitty_mod+down                 scroll_line_down smooth
# map --allow-fallback=shifted,ascii kitty_mod+j scroll_line_down smooth
# map opt+cmd+page_down              scroll_line_down smooth
# map cmd+down                       scroll_line_down smooth

#: 向上滚动一页

# map kitty_mod+page_up scroll_page_up
# map cmd+page_up       scroll_page_up

#: 向下滚动一页

# map kitty_mod+page_down scroll_page_down
# map cmd+page_down       scroll_page_down

#: 滚动到顶部

# map kitty_mod+home scroll_home
# map cmd+home       scroll_home

#: 滚动到底部

# map kitty_mod+end scroll_end
# map cmd+end       scroll_end

#: 滚动到上一个 shell prompt

# map --allow-fallback=shifted,ascii kitty_mod+z scroll_to_prompt -1

#::  为 scroll_to_prompt 使用参数 0 可滚动到最后
#::  跳转到的或最后点击的位置。需要 shell
#::  integration <https://sw.kovidgoyal.net/kitty/shell-integration/>
#::  才能工作。

#: 滚动到下一个 shell prompt

# map --allow-fallback=shifted,ascii kitty_mod+x scroll_to_prompt 1

#: 在 pager 中浏览 scrollback buffer

# map --allow-fallback=shifted,ascii kitty_mod+h show_scrollback

#::  你可以使用 launch --stdin-
#::  source 将当前屏幕和 history
#::  buffer 的内容作为 STDIN 通过管道传给任意程序。例如，
#::  以下命令在 overlay window 中打开 less 中的 scrollback buffer::

#::      map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less +G -R

#::  有关将屏幕和 buffer 内容通过管道传给外部
#::  程序的更多细节，请参见 launch <https://sw.kovidgoyal.net/kitty/launch/>。

#: 在 pager 中浏览最后一条 shell 命令的输出

# map --allow-fallback=shifted,ascii kitty_mod+g show_last_command_output

#::  你也可以定义额外的快捷键来获取命令
#::  输出。例如，要获取屏幕上的第一条命令输出::

#::      map f1 show_first_command_output_on_screen

#::  要获取最后被键盘
#::  action 或 mouse action 访问的命令输出::

#::      map f1 show_last_visited_command_output

#::  你可以使用 launch action 将 shell 中运行的
#::  最后一条命令的输出通过管道传出去。例如，
#::  以下命令在 overlay window 中打开 less 中的输出::

#::      map f1 launch --stdin-source=@last_cmd_output --stdin-add-formatting --type=overlay less +G -R

#::  要获取屏幕上第一条命令的输出，使用
#::  @first_cmd_output_on_screen。要获取最后跳转
#::  到的命令的输出，使用 @last_visited_cmd_output。

#::  需要 shell integration
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> 才能工作。

#: 在 pager 中搜索 scrollback

# map kitty_mod+/                    search_scrollback
# map --allow-fallback=shifted,ascii cmd+f search_scrollback

#::  使用配置的 scrollback_pager 在 scrollback 中搜索当前选中的文本。
#::  假设按 / 键
#::  会触发 pager 的搜索模式。如果你想为此创建
#::  带特殊 pager 的手动映射，可以使用类似
#::  以下的方式：

#::      map f1 combine : launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay mypager : send_key /

#::  对于更复杂的控制（例如使用当前
#::  selection），请使用 remote_control_script。

#: }}}

#: Window management {{{

#: 新 window

# map kitty_mod+enter new_window
# map cmd+enter       new_window

#::  你可以打开运行任意程序的新 kitty window，
#::  例如::

#::      map kitty_mod+y launch mutt

#::  你可以打开一个新 window，其当前工作目录
#::  设置为当前 window 的工作目录，
#::  使用::

#::      map ctrl+alt+enter launch --cwd=current

#::  你可以打开一个新 window，允许它通过
#::  kitty remote control 机制控制 kitty，
#::  使用 launch --allow-remote-
#::  control。该 window 中运行的任何程序都将被允许
#::  控制 kitty。例如::

#::      map ctrl+enter launch --allow-remote-control some_program

#::  你可以打开一个位于当前活动 window 旁边
#::  或作为第一个 window 的新 window，使用::

#::      map ctrl+n launch --location=neighbor
#::      map ctrl+f launch --location=first

#::  更多细节，请参见 launch
#::  <https://sw.kovidgoyal.net/kitty/launch/>。

#: 新 OS window

# map --allow-fallback=shifted,ascii kitty_mod+n new_os_window
# map --allow-fallback=shifted,ascii cmd+n new_os_window

#::  与上面的 new_window 类似，区别在于它打开一个顶级 OS
#::  window。特别是，你可以使用 new_os_window_with_cwd 打开
#::  具有当前工作目录的 window。

#: 关闭 window

# map --allow-fallback=shifted,ascii kitty_mod+w close_window
# map --allow-fallback=shifted,ascii shift+cmd+d close_window

#: 下一个 window

# map kitty_mod+] next_window

#: 上一个 window

# map kitty_mod+[ previous_window

#: 向前移动 window

# map --allow-fallback=shifted,ascii kitty_mod+f move_window_forward

#: 向后移动 window

# map --allow-fallback=shifted,ascii kitty_mod+b move_window_backward

#: 将 window 移动到顶部

# map kitty_mod+` move_window_to_top

#: 开始调整 window 大小

# map --allow-fallback=shifted,ascii kitty_mod+r start_resizing_window
# map --allow-fallback=shifted,ascii cmd+r start_resizing_window

#: 第一个 window

# map kitty_mod+1 first_window
# map cmd+1       first_window

#: 第二个 window

# map kitty_mod+2 second_window
# map cmd+2       second_window

#: 第三个 window

# map kitty_mod+3 third_window
# map cmd+3       third_window

#: 第四个 window

# map kitty_mod+4 fourth_window
# map cmd+4       fourth_window

#: 第五个 window

# map kitty_mod+5 fifth_window
# map cmd+5       fifth_window

#: 第六个 window

# map kitty_mod+6 sixth_window
# map cmd+6       sixth_window

#: 第七个 window

# map kitty_mod+7 seventh_window
# map cmd+7       seventh_window

#: 第八个 window

# map kitty_mod+8 eighth_window
# map cmd+8       eighth_window

#: 第九个 window

# map kitty_mod+9 ninth_window
# map cmd+9       ninth_window

#: 第十个 window

# map kitty_mod+0 tenth_window

#: 视觉选择并聚焦 window

# map kitty_mod+f7 focus_visible_window

#::  在 window 上显示 overlay 数字和字母，当你
#::  按下按键时将 focus 切换到该 window。当
#::  只有两个 window 时，直接切换 focus 而
#::  不显示 overlay。你可以使用选项 visual_window_select_characters 更改 overlay 字符及其
#::  顺序。

#: 视觉上将 window 与另一个交换

# map kitty_mod+f8 swap_with_window

#::  工作方式与上面的 focus_visible_window 类似，但交换 window。

#: }}}

#: Tab management {{{

#: 下一个 tab

# map kitty_mod+right next_tab
# map shift+cmd+]     next_tab
# map ctrl+tab        next_tab

#: 上一个 tab

# map kitty_mod+left previous_tab
# map shift+cmd+[    previous_tab
# map ctrl+shift+tab previous_tab

#: 新 tab

# map --allow-fallback=shifted,ascii kitty_mod+t new_tab
# map --allow-fallback=shifted,ascii cmd+t new_tab

#: 关闭 tab

# map --allow-fallback=shifted,ascii kitty_mod+q close_tab
# map --allow-fallback=shifted,ascii cmd+w close_tab

#: 关闭 OS window

# map --allow-fallback=shifted,ascii shift+cmd+w close_os_window

#: 向前移动 tab

# map kitty_mod+. move_tab_forward

#: 向后移动 tab

# map kitty_mod+, move_tab_backward

#: 设置 tab title

# map --allow-fallback=shifted,ascii kitty_mod+alt+t set_tab_title
# map --allow-fallback=shifted,ascii shift+cmd+i set_tab_title


#: 你还可以创建转到特定 tab 的快捷键，1 表示
#: 第一个 tab，2 表示第二个 tab，-1 表示之前活动的
#: tab，-2 表示在之前活动 tab 之前活动的 tab，
#: 依此类推。任何大于 tab 数量的数字都会转到最后一个
#: tab，任何小于历史中之前使用过的 tab 数量的数字
#: 会转到历史中最旧的之前使用过的 tab::

#:     map ctrl+alt+1 goto_tab 1
#:     map ctrl+alt+2 goto_tab 2

#: 与上面的 new_window 一样，你也可以在使用 new_tab 和 new_tab_with_cwd
#: 时传递要运行的任意命令的名称。
#: 最后，如果你希望新 tab 打开在
#: 当前 tab 旁边而不是 tab 列表末尾，请使用::

#:     map ctrl+t new_tab !neighbor [optional cmd to run]
#: }}}

#: Layout management {{{

#: 下一个 layout

# map --allow-fallback=shifted,ascii kitty_mod+l next_layout


#: 你还可以创建切换到特定 layout 的快捷键::

#:     map ctrl+alt+t goto_layout tall
#:     map ctrl+alt+s goto_layout stack

#: 类似地，要切换回上一个 layout::

#:     map ctrl+alt+p last_used_layout

#: 还有一个 toggle_layout action，它切换到指定的
#: layout，如果已在指定 layout 中则切换回上一个 layout。
#: 通过切换到
#: stack layout 来临时"缩放"活动 window 很有用::

#:     map ctrl+alt+z toggle_layout stack
#: }}}

#: Font sizes {{{

#: 你可以一次更改所有顶级 kitty OS window
#: 的 font size，或只更改当前一个。

#: 增大 font size

# map kitty_mod+equal  change_font_size all +2.0
# map kitty_mod+plus   change_font_size all +2.0
# map kitty_mod+kp_add change_font_size all +2.0
# map cmd+plus         change_font_size all +2.0
# map cmd+equal        change_font_size all +2.0
# map shift+cmd+equal  change_font_size all +2.0

#: 减小 font size

# map kitty_mod+minus       change_font_size all -2.0
# map kitty_mod+kp_subtract change_font_size all -2.0
# map cmd+minus             change_font_size all -2.0
# map shift+cmd+minus       change_font_size all -2.0

#: 重置 font size

# map kitty_mod+backspace change_font_size all 0
# map cmd+0               change_font_size all 0


#: 为特定 font size 设置快捷键::

#:     map kitty_mod+f6 change_font_size all 10.0

#: 设置只更改当前 OS window 的 font
#: size 的快捷键::

#:     map kitty_mod+f6 change_font_size current 10.0

#: 设置乘/除 font size 的快捷键::

#:     map kitty_mod+f6 change_font_size all *2.0
#:     map kitty_mod+f6 change_font_size all /2.0
#: }}}

#: Select and act on visible text {{{

#: 使用 hints kitten 选择文本，并将其传递给
#: 外部程序、插入 terminal 或复制到
#: clipboard。

#: 打开 URL

# map --allow-fallback=shifted,ascii kitty_mod+e open_url_with_hints

#::  使用键盘打开当前可见的 URL。用于
#::  打开 URL 的程序在 open_url_with 中指定。

#: 插入选中的路径

# map --allow-fallback=shifted,ascii kitty_mod+p>f kitten hints --type path --program -

#::  选择路径/文件名并将其插入 terminal。例如，
#::  对前一条 git 命令输出的文件名运行
#::  git 命令时很有用。

#: 打开选中的路径

# map --allow-fallback=shifted,ascii kitty_mod+p>shift+f kitten hints --type path

#::  选择路径/文件名并用默认的 open 程序打开它。

#: 插入选中的文件

# map --allow-fallback=shifted,ascii kitty_mod+p>c kitten choose-files

#::  使用 choose-files
#::  <https://sw.kovidgoyal.net/kitty/kittens/choose-files/> kitten
#::  选择文件并将其插入 terminal。

#: 插入选中的目录

# map --allow-fallback=shifted,ascii kitty_mod+p>d kitten choose-files --mode=dir

#::  使用 choose-files
#::  <https://sw.kovidgoyal.net/kitty/kittens/choose-files/> kitten
#::  选择目录并将其插入 terminal。

#: 插入选中的行

# map --allow-fallback=shifted,ascii kitty_mod+p>l kitten hints --type line --program -

#::  选择一行文本并将其插入 terminal。对于
#::  `ls -1` 之类的输出很有用。

#: 插入选中的单词

# map --allow-fallback=shifted,ascii kitty_mod+p>w kitten hints --type word --program -

#::  选择单词并插入 terminal。

#: 插入选中的 hash

# map --allow-fallback=shifted,ascii kitty_mod+p>h kitten hints --type hash --program -

#::  选择看起来像 hash 的内容并插入
#::  terminal。与 git 一起使用时很有用，git 使用 SHA1 hash 标识
#::  commit。

#: 在指定行打开选中的文件

# map --allow-fallback=shifted,ascii kitty_mod+p>n kitten hints --type linenum

#::  选择看起来像 filename:linenum 的内容，并在
#::  默认编辑器的指定行号处打开它。

#: 打开选中的 hyperlink

# map --allow-fallback=shifted,ascii kitty_mod+p>y kitten hints --type hyperlink

#::  选择 hyperlink（即已被
#::  terminal 程序标记为 hyperlink 的 URL，例如，由 `ls --hyperlink=auto`）。


#: hints kitten 还有更多操作模式，你可以
#: 映射到不同的快捷键。完整描述参见 hints kitten
#: <https://sw.kovidgoyal.net/kitty/kittens/hints/>。
#: }}}

#: Miscellaneous {{{

#: 显示文档

# map kitty_mod+f1 show_kitty_doc overview

#: 命令面板

# map kitty_mod+f3 command_palette

#: 切换全屏

# map kitty_mod+f11                  toggle_fullscreen
# map --allow-fallback=shifted,ascii ctrl+cmd+f toggle_fullscreen

#: 切换最大化

# map kitty_mod+f10 toggle_maximized

#: 切换 macOS secure keyboard entry

# map --allow-fallback=shifted,ascii opt+cmd+s toggle_macos_secure_keyboard_entry

#: macOS 循环切换 OS window

# map cmd+` macos_cycle_through_os_windows

#: macOS 向后循环切换 OS window

# map cmd+shift+` macos_cycle_through_os_windows_backwards

#: Unicode 输入

# map --allow-fallback=shifted,ascii kitty_mod+u kitten unicode_input
# map ctrl+cmd+space                 kitten unicode_input

#: 编辑 config 文件

# map kitty_mod+f2 edit_config_file
# map cmd+,        edit_config_file

#: 打开 kitty 命令 shell

# map kitty_mod+escape kitty_shell window

#::  在新 window / tab / overlay / os_window 中打开 kitty shell，
#::  以使用命令控制 kitty。

#: 增大 background opacity

# map --allow-fallback=shifted,ascii kitty_mod+a>m set_background_opacity +0.1

#: 减小 background opacity

# map --allow-fallback=shifted,ascii kitty_mod+a>l set_background_opacity -0.1

#: 使 background 完全不透明

# map --allow-fallback=shifted,ascii kitty_mod+a>1 set_background_opacity 1

#: 重置 background opacity

# map --allow-fallback=shifted,ascii kitty_mod+a>d set_background_opacity default

#: 重置 terminal

# map kitty_mod+delete clear_terminal reset active
# map opt+cmd+r        clear_terminal reset active

#::  你可以创建清除/重置 terminal 的快捷键。例如::

#::      # 重置 terminal
#::      map f1 clear_terminal reset active
#::      # 通过擦除所有内容清除 terminal 屏幕
#::      map f1 clear_terminal clear active
#::      # 通过擦除来清除 terminal scrollback
#::      map f1 clear_terminal scrollback active
#::      # 将屏幕内容滚动到 scrollback 中
#::      map f1 clear_terminal scroll active
#::      # 清除屏幕上到 cursor 所在行或当前 prompt 开头的所有内容（需要 shell integration）
#::      map f1 clear_terminal to_cursor active
#::      # 与上述相同，区别在于被清除的行移入 scrollback
#::      map f1 clear_terminal to_cursor_scroll active
#::      # 擦除最后一条命令及其输出（需要 shell integration 才能工作）
#::      map f1 clear_terminal last_command active

#::  如果你想操作所有 kitty window 而不仅仅是
#::  当前 window，请使用 all 而不是 active。

#::  一些可以在 shell rc 文件中定义的有用函数，
#::  用于执行各种类型的当前 window 清除：

#::  .. code-block:: sh

#::      clear-only-screen() {
#::          printf "\e[H\e[2J"
#::      }

#::      clear-screen-and-scrollback() {
#::          printf "\e[H\e[3J"
#::      }

#::      clear-screen-saving-contents-in-scrollback() {
#::          printf "\e[H\e[22J"
#::      }

#::  例如，使用这些 escape code，可以将
#::  Ctrl+L 重新映射为既将当前屏幕内容滚动到
#::  scrollback buffer 又清除屏幕，而不只是清除
#::  屏幕。对于 ZSH，在 ~/.zshrc 中添加：

#::  .. code-block:: zsh

#::      ctrl_l() {
#::          builtin print -rn -- $'\r\e[0J\e[H\e[22J' >"$TTY"
#::          builtin zle .reset-prompt
#::          builtin zle -R
#::      }
#::      zle -N ctrl_l
#::      bindkey '^l' ctrl_l

#::  或者，你只需将 map ctrl+l clear_terminal
#::  to_cursor_scroll active 添加到 kitty.conf，它不需要
#::  更改 shell rc 文件即可工作，但只清除到 prompt 为止，
#::  不会清除 prompt 本身的任何文本。

#: 清除到开头

# map cmd+k clear_terminal to_cursor active

#: 清除 scrollback

# map option+cmd+k clear_terminal scrollback active

#: 清除最后一条命令

# map cmd+l clear_terminal last_command active

#: 清除屏幕

# map cmd+ctrl+l clear_terminal to_cursor_scroll active

#: 重新加载 kitty.conf

# map kitty_mod+f5 load_config_file
# map ctrl+cmd+,   load_config_file

#::  重新加载 kitty.conf，应用自上次
#::  加载以来的任何更改。注意少数选项无法动态
#::  更改，需要完全重启 kitty。特别是，更改
#::  macOS 全局菜单
#::  栏上 action 的快捷键时，需要完全重启。你也可以将按键绑定
#::  映射为加载不同的 config 文件，例如::

#::      map f5 load_config /path/to/alternative/kitty.conf

#::  注意原始 kitty.conf 中的所有选项都会被丢弃，
#::  换句话说，新配置*替换*旧配置。

#: 调试 kitty 配置

# map kitty_mod+f6 debug_config
# map opt+cmd+,    debug_config

#::  显示 kitty 正在运行的精确配置
#::  及其宿主环境的详细信息。对调试问题很有用。

#: 按键时发送任意文本

#::  例如：map ctrl+shift+alt+h send_text all Hello World

#::  你可以告诉 kitty 在按下指定快捷键时向
#::  客户端程序发送任意（UTF-8）编码的文本。例如::

#::      map ctrl+alt+a send_text all Special text

#::  这将在你按下 Ctrl+Alt+A 键
#::  组合时发送 "Special text"。要发送的文本会解码 ANSI C escapes
#::  <https://www.gnu.org/software/bash/manual/html_node/ANSI_002dC-
#::  Quoting.html>，因此你可以使用 \e 之类的 escapes 发送 control
#::  code，或使用 \u21fb 发送 Unicode 字符（或者你可以直接输入
#::  Unicode 字符作为 UTF-8 文本）。你可以使用
#::  `kitten show-key` 获取你想
#::  模拟的按键 escape code。

#::  send_text 的第一个参数是
#::  激活快捷键的 keyboard mode。可能的值是 normal、
#::  application、kitty 或它们的逗号分隔组合。
#::  normal 和 application 模式指 terminal 的 DECCKM cursor key mode，
#::  kitty 指 kitty 扩展键盘
#::  协议。特殊值 all 表示全部。

#::  更多示例::

#::      # 输出一个单词并将 cursor 移动到行首（如同输入后按 Home）
#::      map ctrl+alt+a send_text normal Word\e[H
#::      map ctrl+alt+a send_text application Word\eOH
#::      # 在 shell prompt 处运行命令（如同输入命令后按 Enter）
#::      map ctrl+alt+a send_text normal,application some command with arguments\r

#: 打开 kitty 网站

# map shift+cmd+/ open_url https://sw.kovidgoyal.net/kitty/

#: 隐藏 macOS kitty 应用程序

# map cmd+h hide_macos_app

#: 隐藏 macOS 其他应用程序

# map opt+cmd+h hide_macos_other_apps

#: 最小化 macOS window

# map cmd+m minimize_macos_window

#: 退出 kitty

# map cmd+q quit

#: }}}

#: }}}


# BEGIN_KITTY_THEME
# Catppuccin-Frappe
include current-theme.conf
# END_KITTY_THEME
